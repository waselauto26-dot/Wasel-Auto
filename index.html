function generateRef() {
  var now = new Date();
  var y = now.getFullYear().toString().slice(-2);
  var m = String(now.getMonth()+1).padStart(2,"0");
  var d = String(now.getDate()).padStart(2,"0");
  var rand = Math.floor(Math.random()*9000+1000);
  return "WA-" + y + m + d + "-" + rand;
}

function logInvoice(data) {
  var log = getInvLog();

function t(en, ar) { return state.ar ? ar : en; }

function el(tag, attrs, children) {
  var e = document.createElement(tag);
  if (attrs) {
    Object.keys(attrs).forEach(function(k) {
      if (k === "className") e.className = attrs[k];
      else if (k === "style" && typeof attrs[k] === "object") Object.assign(e.style, attrs[k]);
      else if (k.startsWith("on") && typeof attrs[k] === "function") e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
      else if (k === "href") e.href = attrs[k];
      else if (k === "target") e.target = attrs[k];
      else if (k === "rel") e.rel = attrs[k];
      else if (k === "type" && (tag==="input"||tag==="button")) e.type = attrs[k];
      else if (k === "placeholder") e.placeholder = attrs[k];
      else if (k === "value") e.value = attrs[k];
      else if (k === "disabled") e.disabled = attrs[k];
      else if (k === "dir") e.dir = attrs[k];
      else if (k === "rows") e.rows = attrs[k];
      else if (k === "checked") e.checked = attrs[k];
      else e.setAttribute(k, attrs[k]);
    });
  }
  if (children) {
    (Array.isArray(children) ? children : [children]).forEach(function(c) {
      if (c === null || c === undefined || c === false) return;
      if (typeof c === "string" || typeof c === "number") e.appendChild(document.createTextNode(c));
      else e.appendChild(c);
    });
  }
  return e;
}

function div(cls, children, extra) {
  return el("div", Object.assign({className: cls||""}, extra||{}), children);
}

function span(cls, text, extra) {
  return el("span", Object.assign({className: cls||""}, extra||{}), [text]);

function btn(cls, text, onclick, disabled) {
  return el("button", {className:"btn " + (cls||""), onClick: onclick, disabled: !!disabled}, [text]);
}

function inp(cls, placeholder, value, onchange, extra) {
  var attrs = Object.assign({className:"ifield " + (cls||""), placeholder: placeholder||"", value: value||""}, extra||{});
  var e = el("input", attrs);
  if (onchange) e.addEventListener("input", function() { onchange(e.value); });
  return e;
}

function sel(cls, options, value, onchange) {
  var e = el("select", {className: "sel " + (cls||"")});
  options.forEach(function(o) {
    var opt = el("option", {value: o.val !== undefined ? o.val : o.label}, [o.label]);
    if ((o.val !== undefined ? o.val : o.label) === value) opt.selected = true;
    e.appendChild(opt);
  });
  e.addEventListener("change", function() { onchange(e.value); });
  return e;
}

function validateRef() {
  var clean = state.invRefInput.trim().toUpperCase();
  if (!clean) { state.invRefError = t("Please enter your order reference.","أدخل رقم المرجع."); render(); return; }
  if (!clean.startsWith("WA-") || clean.length < 12) { state.invRefError = t("Invalid format. Example: WA-260725-1234","صيغة غير صحيحة. مثال: WA-260725-1234"); render(); return; }
  state.invRefError = "";
  state.invRef = clean;
  state.invUnlocked = true;
  if (state.preloadParts.length > 0) {
    state.preloadParts.forEach(function(p){state.invItems.push({id:Date.now()+Math.random(),desc:p.name,cost:p.price,margin:20,qty:1});});
    state.preloadParts = [];
  }
  render();
}

function handleImageFile(file) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    state.imgSrc = ev.target.result;
    state.imgB64 = ev.target.result.split(",")[1];
    render();
  };
  reader.readAsDataURL(file);
}

async function doAISearch() {
  if (!state.vin && !state.desc && !state.imgB64) return;
  state.aiLoad = true; state.aiRes = null; state.hls = []; state.showRFQ = false;
  render();
  try {
    var content = [];
    if (state.imgB64) content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:state.imgB64}});
    content.push({type:"text",text:"VIN/Chassis: "+(state.vin||"not provided")+"\nDescription: "+(state.desc||"not provided")+(state.imgB64?"\nImage attached.":"")});
    var res = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:800,
        system:"You are a GCC automotive parts expert. Identify parts from VIN, description or image. Respond ONLY with valid JSON no markdown: {\"partName\":\"string\",\"partNameAr\":\"string\",\"category\":\"string\",\"makes\":[\"string\"],\"models\":[\"string\"],\"yearRange\":{\"from\":0,\"to\":0},\"confidence\":\"high\",\"notes\":\"string\",\"notesAr\":\"string\"}",
        messages:[{role:"user",content:content}]})
    });
    var data = await res.json();
    var text = (data.content||[]).map(function(b){return b.text||"";}).join("");
    var result = JSON.parse(text.replace(/```json|```/g,"").trim());
    state.aiRes = result;
    var ids = PARTS.filter(function(p){
      return (result.models||[]).some(function(m){return p.model.toLowerCase().includes(m.toLowerCase());}) ||
             (result.makes||[]).some(function(m){return p.make.toLowerCase().includes(m.toLowerCase());}) ||
             (result.category && p.cat.toLowerCase() === result.category.toLowerCase()) ||
             (result.partName && p.name.toLowerCase().includes(result.partName.toLowerCase().split(" ")[0]));
    }).map(function(p){return p.id;});
    state.hls = ids;
    if (ids.length === 0) state.showRFQ = true;
  } catch(e) { console.error(e); state.showRFQ = true; }
  state.aiLoad = false;
  render();
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
