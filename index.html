<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Wasel Auto | وصل أوتو — Find Auto Parts in Bahrain</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,600;0,700;0,900;1,700&family=JetBrains+Mono:wght@400;500;600&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--red:#CE1126;--red2:#e8253a;--dark:#111;--dark2:#1e1e1e;--bg:#f5f5f5;--surf:#fff;--surf2:#f0f0f0;--bdr:#e0e0e0;--txt:#111;--mut:#777;--grn:#15803d;--grn2:#dcfce7;--gold:#b45309;--gold2:#fef3c7;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--txt);font-family:'Barlow',sans-serif;min-height:100vh;}
.nav{display:flex;align-items:center;justify-content:space-between;padding:0 1.2rem;height:58px;background:var(--dark);border-bottom:3px solid var(--red);position:sticky;top:0;z-index:300;}
.logo{display:flex;align-items:flex-end;cursor:pointer;text-decoration:none;}
.lw{font-family:'Barlow';font-weight:900;font-size:1.6rem;color:white;letter-spacing:-1px;line-height:1;}
.la{font-family:'Barlow';font-weight:700;font-size:0.85rem;color:var(--red);font-style:italic;margin-left:4px;margin-bottom:2px;}
.nav-actions{display:flex;gap:6px;align-items:center;}
.lang-btn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:white;padding:5px 11px;border-radius:5px;font-size:0.75rem;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;}
.lang-btn:hover{background:rgba(255,255,255,0.18);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border-radius:7px;border:none;cursor:pointer;font-weight:700;transition:all 0.15s;white-space:nowrap;text-decoration:none;font-size:0.85rem;}
.btn.ar{font-family:'Cairo',sans-serif;}
.btn.en{font-family:'Barlow',sans-serif;text-transform:uppercase;letter-spacing:0.03em;}
.btn-r{background:var(--red);color:white;}.btn-r:hover{background:var(--red2);transform:translateY(-1px);box-shadow:0 4px 14px rgba(206,17,38,0.35);}
.btn-r:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none;}
.btn-d{background:var(--dark);color:white;}.btn-d:hover{background:var(--dark2);}
.btn-ol{background:transparent;color:var(--red);border:2px solid var(--red);}.btn-ol:hover{background:var(--red);color:white;}
.btn-gh{background:var(--surf2);color:var(--txt);border:1.5px solid var(--bdr);}.btn-gh:hover{border-color:var(--red);color:var(--red);}
.btn-wa{background:#25D366;color:white;}.btn-wa:hover{background:#1ebe5d;transform:translateY(-1px);}
.btn-gold{background:var(--gold);color:white;}.btn-gold:hover{background:#92400e;transform:translateY(-1px);}
.btn-sm{padding:6px 13px;font-size:0.78rem;}
.btn-lg{padding:12px 26px;font-size:0.92rem;}
.btn-full{width:100%;}
.apptabs{display:flex;background:var(--dark2);border-bottom:2px solid var(--red);overflow-x:auto;}
.apptab{flex:1;min-width:72px;padding:10px 4px;border:none;background:transparent;color:#888;font-weight:700;cursor:pointer;transition:all 0.15s;font-size:0.73rem;border-bottom:3px solid transparent;white-space:nowrap;}
.apptab.en{font-family:'Barlow',sans-serif;text-transform:uppercase;letter-spacing:0.03em;}
.apptab.ar{font-family:'Cairo',sans-serif;font-size:0.8rem;}
.apptab.on{color:white;border-bottom-color:var(--red);background:rgba(255,255,255,0.04);}
.apptab:hover:not(.on){color:#ccc;}
.tabico{display:block;font-size:0.95rem;margin-bottom:2px;}
.shero{background:var(--dark);padding:1.8rem 1.2rem;border-bottom:3px solid var(--red);}
.shero-inner{max-width:700px;margin:0 auto;}
.shero-title{font-family:'Barlow';font-weight:900;font-size:clamp(1.4rem,4vw,2rem);color:white;margin-bottom:4px;}
.shero-title.ar{font-family:'Cairo';font-weight:900;}
.shero-sub{color:#999;font-size:0.88rem;margin-bottom:1.2rem;}
.shero-sub.ar{font-family:'Cairo';}
.sbox{background:white;border-radius:10px;padding:1rem;box-shadow:0 4px 20px rgba(0,0,0,0.15);}
.srow{display:grid;grid-template-columns:1fr 1fr;gap:0.7rem;margin-bottom:0.7rem;}
.ig{display:flex;flex-direction:column;gap:4px;}
.il{font-size:0.65rem;font-weight:700;letter-spacing:0.08em;color:var(--mut);text-transform:uppercase;}
.il.ar{font-family:'Cairo';letter-spacing:0;font-size:0.72rem;}
.ifield{background:var(--surf2);border:1.5px solid var(--bdr);border-radius:7px;padding:9px 12px;color:var(--txt);font-size:0.88rem;outline:none;transition:border 0.15s;width:100%;font-family:'Barlow',sans-serif;}
.ifield.ar{font-family:'Cairo',sans-serif;}
.ifield:focus{border-color:var(--red);background:white;}
.ifield::placeholder{color:#bbb;}
.sel{background:var(--surf2);border:1.5px solid var(--bdr);border-radius:7px;padding:9px 12px;color:var(--txt);font-size:0.88rem;outline:none;cursor:pointer;appearance:none;width:100%;transition:border 0.15s;font-family:'Barlow',sans-serif;}
.sel.ar{font-family:'Cairo',sans-serif;}
.sel:focus{border-color:var(--red);}
.psec{max-width:1200px;margin:0 auto;padding:1.2rem;}
.psec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px;}
.psec-title{font-family:'Barlow';font-weight:900;font-size:1.1rem;text-transform:uppercase;}
.psec-title.ar{font-family:'Cairo';text-transform:none;font-size:1.15rem;}
.psec-count{font-family:'JetBrains Mono';font-size:0.75rem;color:var(--mut);background:var(--surf2);padding:3px 10px;border-radius:99px;border:1px solid var(--bdr);}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:0.9rem;}
.pcard{background:white;border:1.5px solid var(--bdr);border-radius:10px;padding:1rem;cursor:pointer;transition:all 0.15s;position:relative;}
.pcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:transparent;transition:background 0.15s;border-radius:10px 0 0 10px;}
.pcard:hover{border-color:var(--red);transform:translateY(-2px);box-shadow:0 6px 20px rgba(206,17,38,0.1);}
.pcard:hover::before,.pcard.hl::before{background:var(--red);}
.pcard.hl{border-color:var(--red);}
.ptype{position:absolute;top:9px;right:9px;font-size:0.6rem;font-weight:700;padding:2px 7px;border-radius:4px;text-transform:uppercase;font-family:'Barlow',sans-serif;}
.ptype-g{background:var(--dark);color:white;}
.ptype-a{background:var(--red);color:white;}
.pcard-cat{font-size:0.65rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;font-family:'JetBrains Mono';}
.pcard-cat.ar{font-family:'Cairo';letter-spacing:0;text-transform:none;}
.pcard-name{font-family:'Barlow';font-weight:700;font-size:0.92rem;margin-bottom:2px;line-height:1.3;padding-right:52px;}
.pcard-name.ar{font-family:'Cairo';font-size:0.95rem;}
.pcard-brand{font-size:0.72rem;color:var(--mut);font-weight:600;margin-bottom:5px;}
.pcard-compat{font-size:0.72rem;color:var(--mut);margin-bottom:8px;}
.pcard-price{font-family:'Barlow';font-size:1.3rem;font-weight:900;color:var(--dark);}
.pcard-price span{font-size:0.7rem;color:var(--mut);margin-left:2px;font-weight:600;}
.pcard-footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--bdr);}
.war-tag{font-size:0.62rem;font-weight:700;color:var(--grn);background:var(--grn2);padding:2px 7px;border-radius:4px;}
.qty-tag{font-size:0.65rem;color:var(--mut);font-family:'JetBrains Mono';}
.pcard-cta{font-size:0.68rem;color:var(--red);margin-top:5px;font-weight:700;font-family:'Barlow';}
.pcard-cta.ar{font-family:'Cairo';}
.frow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem;align-items:center;}
.pill{padding:5px 12px;border-radius:99px;border:1.5px solid var(--bdr);background:white;color:var(--mut);font-size:0.72rem;font-weight:700;cursor:pointer;transition:all 0.15s;font-family:'Barlow',sans-serif;text-transform:uppercase;}
.pill.ar{font-family:'Cairo',sans-serif;text-transform:none;font-size:0.78rem;}
.pill.on{background:var(--dark);color:white;border-color:var(--dark);}
.pill:hover:not(.on){border-color:var(--red);color:var(--red);}
.typetog{display:flex;background:var(--surf2);border:1.5px solid var(--bdr);border-radius:7px;overflow:hidden;}
.ttbtn{padding:5px 12px;border:none;background:transparent;font-size:0.72rem;font-weight:700;cursor:pointer;transition:all 0.15s;text-transform:uppercase;color:var(--mut);font-family:'Barlow',sans-serif;}
.ttbtn.ar{font-family:'Cairo',sans-serif;text-transform:none;font-size:0.78rem;}
.ttbtn.on{background:var(--dark);color:white;}
.ov{position:fixed;inset:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(4px);z-index:500;display:flex;align-items:center;justify-content:center;padding:1rem;}
.mod{background:white;border-radius:14px;max-width:480px;width:100%;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,0.25);max-height:92vh;overflow-y:auto;}
.mod-head{background:var(--dark);color:white;padding:1.2rem 1.4rem;border-bottom:3px solid var(--red);position:relative;}
.mod-close{position:absolute;top:0.9rem;right:0.9rem;background:rgba(255,255,255,0.1);border:none;color:white;border-radius:5px;width:28px;height:28px;cursor:pointer;font-size:0.85rem;display:flex;align-items:center;justify-content:center;}
.mod-pname{font-family:'Barlow';font-size:1.1rem;font-weight:900;margin-top:4px;}
.mod-pname.ar{font-family:'Cairo';}
.mod-price{font-family:'Barlow';font-size:1.8rem;font-weight:900;color:var(--red);margin-top:2px;}
.mod-body{padding:1.2rem 1.4rem;}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--bdr);font-size:0.83rem;}
.mrow:last-of-type{border-bottom:none;}
.mrl{font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--mut);}
.mrl.ar{font-family:'Cairo';letter-spacing:0;font-size:0.75rem;text-transform:none;}
.mod-notice{background:#fff8f8;border:1px solid rgba(206,17,38,0.2);border-radius:8px;padding:0.9rem;font-size:0.78rem;color:var(--mut);line-height:1.6;margin-top:0.9rem;}
.mod-notice.ar{font-family:'Cairo';font-size:0.82rem;}
.mod-actions{padding:0 1.4rem 1.4rem;display:flex;flex-direction:column;gap:8px;}
.panel{background:white;border:1.5px solid var(--bdr);border-radius:12px;overflow:hidden;margin-bottom:1rem;}
.phead{background:var(--dark);padding:0.9rem 1.2rem;display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--red);}
.phead-ico{width:30px;height:30px;background:var(--red);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:0.9rem;flex-shrink:0;}
.phead-title{font-family:'Barlow';font-weight:700;font-size:0.88rem;color:white;text-transform:uppercase;}
.phead-title.ar{font-family:'Cairo';text-transform:none;font-size:0.95rem;}
.phead-sub{font-size:0.67rem;color:#aaa;margin-top:1px;}
.phead-sub.ar{font-family:'Cairo';}
.pbody{padding:1.2rem;}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0.9rem;}
.ff{grid-column:1/-1;}
.fsec{margin-bottom:1.3rem;}
.fsec-t{font-size:0.65rem;font-weight:700;letter-spacing:0.15em;color:var(--red);text-transform:uppercase;margin-bottom:0.7rem;padding-bottom:5px;border-bottom:2px solid var(--bdr);}
.fsec-t.ar{font-family:'Cairo';letter-spacing:0;font-size:0.75rem;text-transform:none;}
.aibox{background:var(--dark);border-radius:9px;padding:1.1rem;margin-top:0.9rem;border-left:4px solid var(--red);}
.aiconf{font-size:0.62rem;font-weight:700;letter-spacing:0.1em;padding:2px 8px;border-radius:99px;text-transform:uppercase;font-family:'JetBrains Mono';}
.aiconf.high{background:rgba(21,128,61,0.2);color:#4ade80;border:1px solid rgba(21,128,61,0.4);}
.aiconf.medium{background:rgba(206,17,38,0.2);color:#ff9090;border:1px solid rgba(206,17,38,0.3);}
.ainm{font-family:'Barlow';font-size:1.1rem;font-weight:900;color:white;margin-top:3px;}
.aitags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.aitag{font-size:0.66rem;font-family:'JetBrains Mono';background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);border-radius:4px;padding:2px 7px;color:#ccc;}
.ainotes{margin-top:7px;font-size:0.78rem;color:#888;line-height:1.6;}
.hlbanner{background:rgba(206,17,38,0.05);border:1.5px solid rgba(206,17,38,0.18);border-radius:7px;padding:0.55rem 1rem;display:flex;align-items:center;gap:8px;margin-bottom:0.9rem;font-size:0.78rem;color:var(--red);font-weight:700;}
.hlbanner.ar{font-family:'Cairo';}
.not-found-box{background:white;border:2px dashed var(--bdr);border-radius:12px;padding:1.5rem;text-align:center;margin-top:1rem;}
.rfq-form{background:var(--surf2);border-radius:9px;padding:1rem;text-align:left;margin-top:0.8rem;}
.rfq-sent{background:var(--grn2);border:1.5px solid var(--grn);border-radius:9px;padding:1rem;text-align:center;}
.rfq-sent.ar{font-family:'Cairo';}
.loading{display:flex;align-items:center;gap:9px;color:var(--red);font-size:0.82rem;padding:0.8rem 0;font-weight:600;}
.spin{width:15px;height:15px;border:2px solid var(--bdr);border-top-color:var(--red);border-radius:50%;animation:sp 0.65s linear infinite;flex-shrink:0;}
@keyframes sp{to{transform:rotate(360deg);}}
.empty{text-align:center;padding:2rem;color:var(--mut);}
.empty h3{font-family:'Barlow';font-weight:900;color:var(--txt);margin-bottom:0.3rem;}
.empty h3.ar{font-family:'Cairo';}
.toast{position:fixed;bottom:1.2rem;right:1.2rem;background:var(--dark);color:white;padding:0.8rem 1.1rem;border-radius:8px;font-size:0.8rem;z-index:9999;animation:su 0.25s ease;border-left:3px solid var(--red);font-weight:600;max-width:300px;}
.toast.ar{font-family:'Cairo';}
@keyframes su{from{transform:translateY(16px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.dzone{border:2px dashed var(--bdr);border-radius:9px;padding:1.2rem;text-align:center;cursor:pointer;transition:all 0.15s;background:var(--surf2);}
.dzone:hover,.dzone.on{border-color:var(--red);background:rgba(206,17,38,0.03);}
.dzone img{max-height:110px;border-radius:7px;object-fit:cover;}
.dzt{color:var(--mut);font-size:0.77rem;margin-top:5px;}
.dzt.ar{font-family:'Cairo';}
.hiw{max-width:700px;margin:0 auto;padding:0 1.2rem 2rem;}
.hiwgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.8rem;}
.hiwcard{background:white;border:1.5px solid var(--bdr);border-top:3px solid var(--red);border-radius:9px;padding:0.9rem;text-align:center;}
.hiw-num{font-size:1.3rem;margin-bottom:3px;}
.hiw-t{font-family:'Barlow';font-weight:700;font-size:0.82rem;margin:3px 0;}
.hiw-t.ar{font-family:'Cairo';}
.hiw-d{font-size:0.73rem;color:var(--mut);line-height:1.5;}
.hiw-d.ar{font-family:'Cairo';}

/* ── INVOICE SYSTEM ── */
.inv-wrap{max-width:860px;margin:0 auto;padding:1.2rem;}
.inv-lock{background:var(--dark);border-radius:12px;padding:2rem;text-align:center;border:2px solid var(--gold);}
.inv-lock-ico{font-size:3rem;margin-bottom:0.8rem;}
.inv-lock-title{font-family:'Barlow';font-weight:900;font-size:1.2rem;color:white;margin-bottom:0.5rem;}
.inv-lock-title.ar{font-family:'Cairo';}
.inv-lock-sub{color:#999;font-size:0.85rem;margin-bottom:1.5rem;line-height:1.7;}
.inv-lock-sub.ar{font-family:'Cairo';}
.inv-lock-box{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:1.2rem;margin-bottom:1.2rem;text-align:left;}
.ref-entry{display:flex;gap:8px;align-items:flex-end;}
.ref-input{background:#1a1a1a;border:2px solid #333;border-radius:7px;padding:10px 14px;color:white;font-family:'JetBrains Mono';font-size:1rem;outline:none;flex:1;letter-spacing:0.1em;transition:border 0.15s;}
.ref-input:focus{border-color:var(--gold);}
.ref-input::placeholder{color:#555;font-size:0.85rem;letter-spacing:0;}
.ref-error{color:#ff9090;font-size:0.75rem;margin-top:5px;font-family:'JetBrains Mono';}
.ref-steps{margin-top:1rem;}
.ref-step{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.06);font-size:0.8rem;color:#888;}
.ref-step:last-child{border-bottom:none;}
.ref-step-num{width:22px;height:22px;border-radius:50%;background:var(--gold);color:white;display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:700;flex-shrink:0;margin-top:1px;}
.inv-hero{background:linear-gradient(135deg,var(--dark),var(--dark2));border-radius:12px;padding:1.2rem;margin-bottom:1rem;border-left:4px solid var(--gold);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.inv-hero-left h3{font-family:'Barlow';font-weight:900;font-size:1rem;color:white;margin-bottom:2px;}
.inv-hero-left h3.ar{font-family:'Cairo';}
.inv-hero-left p{color:#999;font-size:0.78rem;}
.inv-hero-left p.ar{font-family:'Cairo';}
.inv-ref-badge{background:var(--gold);color:white;font-family:'JetBrains Mono';font-size:0.78rem;font-weight:700;padding:5px 12px;border-radius:6px;}

/* PDF INVOICE STYLES */
.inv-doc{background:white;border:1px solid var(--bdr);border-radius:8px;overflow:hidden;margin-bottom:1rem;font-family:'Barlow',sans-serif;}
.inv-doc-topbar{background:var(--red);height:8px;}
.inv-doc-body{padding:2rem;}
.inv-doc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.5rem;padding-bottom:1.2rem;border-bottom:2px solid var(--bdr);}
.inv-doc-logo{font-family:'Barlow';font-weight:900;font-size:1.8rem;color:var(--dark);letter-spacing:-1px;}
.inv-doc-logo span{color:var(--red);font-style:italic;}
.inv-doc-logo-sub{font-size:0.7rem;color:var(--mut);margin-top:2px;font-family:'JetBrains Mono';}
.inv-doc-right{text-align:right;}
.inv-doc-title{font-family:'Barlow';font-weight:900;font-size:1.4rem;color:var(--red);text-transform:uppercase;letter-spacing:2px;}
.inv-doc-ref{font-family:'JetBrains Mono';font-size:0.78rem;color:var(--mut);margin-top:4px;}
.inv-doc-date{font-family:'JetBrains Mono';font-size:0.75rem;color:var(--mut);margin-top:2px;}
.inv-parties{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1.5rem;}
.inv-party-lbl{font-size:0.62rem;font-weight:700;letter-spacing:0.12em;color:var(--mut);text-transform:uppercase;margin-bottom:5px;font-family:'JetBrains Mono';}
.inv-party-name{font-family:'Barlow';font-weight:700;font-size:0.92rem;color:var(--dark);}
.inv-party-name.ar{font-family:'Cairo';}
.inv-party-detail{font-size:0.75rem;color:var(--mut);margin-top:2px;}
.inv-table{width:100%;border-collapse:collapse;margin-bottom:1.2rem;font-size:0.82rem;}
.inv-table thead tr{background:var(--dark);color:white;}
.inv-table th{padding:9px 12px;text-align:left;font-size:0.67rem;text-transform:uppercase;letter-spacing:0.06em;font-family:'JetBrains Mono';}
.inv-table td{padding:10px 12px;border-bottom:1px solid var(--bdr);}
.inv-table tr:last-child td{border-bottom:none;}
.inv-table tr:nth-child(even) td{background:#fafafa;}
.inv-totals{display:flex;justify-content:flex-end;}
.inv-totals-box{min-width:260px;}
.inv-total-row{display:flex;justify-content:space-between;padding:5px 0;font-size:0.83rem;border-bottom:1px solid var(--bdr);}
.inv-total-row:last-child{border-bottom:none;}

/* ── REFERENCE GENERATOR ── */
function generateRef(){
  const now=new Date();
  const y=now.getFullYear().toString().slice(-2);
  const m=String(now.getMonth()+1).padStart(2,"0");
  const d=String(now.getDate()).padStart(2,"0");
  const rand=Math.floor(Math.random()*9000+1000);
  return `WA-${y}${m}${d}-${rand}`;
}

/* ── VALID REFS (Wasel Auto issues these after payment) ── */
const VALID_REFS_KEY="wasel_valid_refs";
function getValidRefs(){
  try{const r=localStorage.getItem(VALID_REFS_KEY);return r?JSON.parse(r):[];}catch{return[];}
}
function addValidRef(ref,data){
  try{
    const refs=getValidRefs();
    refs.push({ref,...data,createdAt:new Date().toISOString(),used:false});
    localStorage.setItem(VALID_REFS_KEY,JSON.stringify(refs));
  }catch{}
}
function markRefUsed(ref){
  try{
    const refs=getValidRefs();
    const idx=refs.findIndex(r=>r.ref===ref);
    if(idx>-1){refs[idx].used=true;localStorage.setItem(VALID_REFS_KEY,JSON.stringify(refs));}
  }catch{}
}
function getRefData(ref){
  try{const refs=getValidRefs();return refs.find(r=>r.ref===ref)||null;}catch{return null;}
}

/* ── INVOICE LOG ── */

function logInvoice(data){

}

async function askAI(prompt,b64){
  const content=[];
  if(b64)content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}});
  content.push({type:"text",text:prompt});
  const res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:800,
      system:`You are a GCC automotive parts expert. Identify parts from VIN, description or image. Respond ONLY with valid JSON no markdown: {"partName":string,"partNameAr":string,"category":string,"makes":[string],"models":[string],"yearRange":{"from":number,"to":number},"confidence":"high"|"medium"|"low","notes":string,"notesAr":string}`,
      messages:[{role:"user",content}]})
  });
  const d=await res.json();
  const t=d.content?.map(b=>b.text||"").join("")||"{}";
  try{return JSON.parse(t.replace(/```json|```/g,"").trim());}catch{return null;}
}

              <div className="ig"><label className={`il ${ar?"ar":""}`}>{t("Margin %","هامش %")}</label><input className="ifield" type="number" value={newItem.margin} onChange={e=>setNewItem(p=>({...p,margin:e.target.value}))} style={{background:"white"}} dir="ltr"/></div>
              <div className="ig"><label className={`il ${ar?"ar":""}`}>{t("Qty","كمية")}</label><input className="ifield" type="number" value={newItem.qty} onChange={e=>setNewItem(p=>({...p,qty:e.target.value}))} style={{background:"white"}} dir="ltr"/></div>

          </div>
          <div className="ig">
            <label className={`il ${ar?"ar":""}`}>{t("Note to Customer","ملاحظة للعميل")}</label>
            <textarea className={`ifield ${ar?"ar":""}`} rows={2} placeholder={t("e.g. Warranty terms, payment notes…","ملاحظات الضمان، الدفع…")} value={note} onChange={e=>setNote(e.target.value)} style={{resize:"vertical"}}/>

      </div>

      {/* WASEL FEE NOTE */}
      {items.length>0&&(

             `عمولة وصل أوتو (4.5%) على تكلفتك: ${waselFee.toFixed(3)} BHD — مشمولة في إجمالي طلبك. ربحك على هذه الفاتورة: ${profit.toFixed(3)} BHD`)}
