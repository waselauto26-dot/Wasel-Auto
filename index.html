<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Wasel Auto | وصل أوتو — Auto Parts Marketplace Bahrain</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,600;0,700;0,900;1,700&family=JetBrains+Mono:wght@400;500;600&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--red:#CE1126;--red2:#e8253a;--dark:#111;--dark2:#1e1e1e;--bg:#f5f5f5;--surf:#fff;--surf2:#f0f0f0;--bdr:#e0e0e0;--txt:#111;--mut:#777;--grn:#15803d;--grn2:#dcfce7;--gold:#b45309;--gold2:#fef3c7;--blue:#1d4ed8;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--txt);font-family:'Barlow',sans-serif;min-height:100vh;}
/* NAV */
.nav{display:flex;align-items:center;justify-content:space-between;padding:0 1.2rem;height:58px;background:var(--dark);border-bottom:3px solid var(--red);position:sticky;top:0;z-index:300;}
.logo{display:flex;align-items:flex-end;cursor:pointer;text-decoration:none;}
.lw{font-family:'Barlow';font-weight:900;font-size:1.6rem;color:white;letter-spacing:-1px;line-height:1;}
.la{font-family:'Barlow';font-weight:700;font-size:0.85rem;color:var(--red);font-style:italic;margin-left:4px;margin-bottom:2px;}
.nav-right{display:flex;gap:8px;align-items:center;}
.cart-btn{background:var(--red);border:none;color:white;padding:6px 14px;border-radius:6px;font-family:'Barlow';font-weight:700;font-size:0.8rem;cursor:pointer;display:flex;align-items:center;gap:6px;text-transform:uppercase;}
.cart-count{background:white;color:var(--red);border-radius:99px;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:900;}
.lang-btn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:white;padding:5px 11px;border-radius:5px;font-size:0.75rem;font-weight:700;cursor:pointer;font-family:'Cairo';}
/* TABS */
.apptabs{display:flex;background:var(--dark2);border-bottom:2px solid var(--red);overflow-x:auto;}
.apptab{flex:1;min-width:60px;padding:9px 4px;border:none;background:transparent;color:#888;font-weight:700;cursor:pointer;font-size:0.7rem;border-bottom:3px solid transparent;white-space:nowrap;font-family:'Barlow';text-transform:uppercase;}
.apptab.on{color:white;border-bottom-color:var(--red);background:rgba(255,255,255,0.04);}
.tabico{display:block;font-size:0.9rem;margin-bottom:2px;}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border-radius:7px;border:none;cursor:pointer;font-weight:700;transition:all 0.15s;white-space:nowrap;text-decoration:none;font-size:0.85rem;font-family:'Barlow';text-transform:uppercase;}
.btn-r{background:var(--red);color:white;}.btn-r:hover{background:var(--red2);transform:translateY(-1px);}
.btn-r:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
.btn-d{background:var(--dark);color:white;}.btn-d:hover{background:var(--dark2);}
.btn-gh{background:var(--surf2);color:var(--txt);border:1.5px solid var(--bdr);}.btn-gh:hover{border-color:var(--red);color:var(--red);}
.btn-wa{background:#25D366;color:white;}.btn-wa:hover{background:#1ebe5d;}
.btn-gold{background:var(--gold);color:white;}
.btn-grn{background:var(--grn);color:white;}
.btn-ol{background:transparent;color:var(--red);border:2px solid var(--red);}.btn-ol:hover{background:var(--red);color:white;}
.btn-sm{padding:5px 12px;font-size:0.75rem;}
.btn-lg{padding:12px 24px;font-size:0.9rem;}
.btn-full{width:100%;justify-content:center;}
/* FORM */
.ig{display:flex;flex-direction:column;gap:4px;}
.il{font-size:0.64rem;font-weight:700;letter-spacing:0.08em;color:var(--mut);text-transform:uppercase;}
.ifield{background:var(--surf2);border:1.5px solid var(--bdr);border-radius:7px;padding:9px 12px;color:var(--txt);font-size:0.88rem;outline:none;transition:border 0.15s;width:100%;font-family:'Barlow';}
.ifield:focus{border-color:var(--red);background:white;}
.ifield::placeholder{color:#bbb;}
.sel{background:var(--surf2);border:1.5px solid var(--bdr);border-radius:7px;padding:9px 12px;color:var(--txt);font-size:0.88rem;outline:none;cursor:pointer;appearance:none;width:100%;font-family:'Barlow';}
.sel:focus{border-color:var(--red);}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0.9rem;}
.ff{grid-column:1/-1;}
.fsec-t{font-size:0.63rem;font-weight:700;letter-spacing:0.15em;color:var(--red);text-transform:uppercase;margin-bottom:0.7rem;padding-bottom:5px;border-bottom:2px solid var(--bdr);}
/* PANELS */
.panel{background:white;border:1.5px solid var(--bdr);border-radius:12px;overflow:hidden;margin-bottom:1rem;}
.phead{background:var(--dark);padding:0.9rem 1.2rem;display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--red);}
.phead-ico{width:30px;height:30px;background:var(--red);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:0.9rem;flex-shrink:0;}
.phead-title{font-family:'Barlow';font-weight:700;font-size:0.88rem;color:white;text-transform:uppercase;}
.phead-sub{font-size:0.67rem;color:#aaa;margin-top:1px;}
.pbody{padding:1.2rem;}
/* SEARCH / HERO */
.shero{background:var(--dark);padding:1.8rem 1.2rem;border-bottom:3px solid var(--red);}
.shero-inner{max-width:700px;margin:0 auto;}
.shero-title{font-family:'Barlow';font-weight:900;font-size:clamp(1.3rem,4vw,1.9rem);color:white;margin-bottom:4px;}
.shero-sub{color:#999;font-size:0.85rem;margin-bottom:1.2rem;}
.sbox{background:white;border-radius:10px;padding:1rem;box-shadow:0 4px 20px rgba(0,0,0,0.15);}
.srow{display:grid;grid-template-columns:1fr 1fr;gap:0.7rem;margin-bottom:0.7rem;}
/* PARTS */
.psec{max-width:1200px;margin:0 auto;padding:1.2rem;}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:0.9rem;}
.pcard{background:white;border:1.5px solid var(--bdr);border-radius:10px;padding:1rem;cursor:pointer;transition:all 0.15s;position:relative;}
.pcard:hover{border-color:var(--red);transform:translateY(-2px);box-shadow:0 6px 20px rgba(206,17,38,0.1);}
.pcard.hl{border-color:var(--red);}
.ptype{position:absolute;top:9px;right:9px;font-size:0.58rem;font-weight:700;padding:2px 6px;border-radius:4px;text-transform:uppercase;font-family:'Barlow';}
.ptype-g{background:var(--dark);color:white;}
.ptype-a{background:var(--red);color:white;}
.pcard-cat{font-size:0.6rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:5px;font-family:'JetBrains Mono';}
.pcard-name{font-family:'Barlow';font-weight:700;font-size:0.9rem;margin-bottom:2px;line-height:1.3;padding-right:52px;}
.pcard-brand{font-size:0.7rem;color:var(--mut);font-weight:600;margin-bottom:5px;}
.pcard-compat{font-size:0.7rem;color:var(--mut);margin-bottom:8px;}
.pcard-price{font-family:'Barlow';font-size:1.25rem;font-weight:900;color:var(--dark);}
.pcard-price span{font-size:0.68rem;color:var(--mut);margin-left:2px;font-weight:600;}
.pcard-price-lock{font-family:'Barlow';font-size:0.82rem;font-weight:700;color:var(--mut);background:var(--surf2);border:1.5px dashed var(--bdr);border-radius:6px;padding:6px 10px;display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.pcard-footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--bdr);}
.war-tag{font-size:0.6rem;font-weight:700;color:var(--grn);background:var(--grn2);padding:2px 6px;border-radius:4px;}
.pcard-cta{font-size:0.68rem;color:var(--red);margin-top:5px;font-weight:700;}
/* FILTERS */
.frow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem;align-items:center;}
.pill{padding:4px 11px;border-radius:99px;border:1.5px solid var(--bdr);background:white;color:var(--mut);font-size:0.7rem;font-weight:700;cursor:pointer;transition:all 0.15s;font-family:'Barlow';text-transform:uppercase;}
.pill.on{background:var(--dark);color:white;border-color:var(--dark);}
.pill:hover:not(.on){border-color:var(--red);color:var(--red);}
.typetog{display:flex;background:var(--surf2);border:1.5px solid var(--bdr);border-radius:7px;overflow:hidden;}
.ttbtn{padding:5px 11px;border:none;background:transparent;font-size:0.7rem;font-weight:700;cursor:pointer;color:var(--mut);font-family:'Barlow';text-transform:uppercase;}
.ttbtn.on{background:var(--dark);color:white;}
/* MEMBER LOGIN */
.member-gate{background:var(--dark);border-radius:14px;padding:2rem;text-align:center;border:2px solid var(--gold);max-width:480px;margin:2rem auto;}
.member-gate h2{font-family:'Barlow';font-weight:900;font-size:1.3rem;color:white;margin-bottom:0.5rem;}
.member-gate p{color:#999;font-size:0.85rem;margin-bottom:1.5rem;line-height:1.7;}
.pin-inputs{display:flex;gap:10px;justify-content:center;margin-bottom:1rem;}
.pin-input{width:56px;height:64px;border:2px solid #333;background:#1a1a1a;border-radius:9px;color:white;font-family:'JetBrains Mono';font-size:1.6rem;font-weight:700;text-align:center;outline:none;transition:border 0.15s;}
.pin-input:focus{border-color:var(--gold);}
.member-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(21,128,61,0.15);border:1px solid rgba(21,128,61,0.35);color:#4ade80;font-size:0.72rem;font-weight:700;padding:4px 12px;border-radius:99px;font-family:'Barlow';text-transform:uppercase;}
/* MODAL */
.ov{position:fixed;inset:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(4px);z-index:500;display:flex;align-items:center;justify-content:center;padding:1rem;}
.mod{background:white;border-radius:14px;max-width:480px;width:100%;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,0.25);max-height:92vh;overflow-y:auto;}
.mod-head{background:var(--dark);color:white;padding:1.2rem 1.4rem;border-bottom:3px solid var(--red);position:relative;}
.mod-close{position:absolute;top:0.9rem;right:0.9rem;background:rgba(255,255,255,0.1);border:none;color:white;border-radius:5px;width:28px;height:28px;cursor:pointer;font-size:0.9rem;}
.mod-pname{font-family:'Barlow';font-size:1.05rem;font-weight:900;margin-top:4px;}
.mod-price{font-family:'Barlow';font-size:1.7rem;font-weight:900;color:var(--red);margin-top:2px;}
.mod-body{padding:1.2rem 1.4rem;}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--bdr);font-size:0.83rem;}
.mrow:last-of-type{border-bottom:none;}
.mrl{font-size:0.67rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--mut);}
.mod-notice{background:#fff8f8;border:1px solid rgba(206,17,38,0.2);border-radius:8px;padding:0.9rem;font-size:0.78rem;color:var(--mut);line-height:1.6;margin-top:0.9rem;}
.mod-actions{padding:0 1.4rem 1.4rem;display:flex;flex-direction:column;gap:8px;}
/* CART */
.cart-wrap{max-width:800px;margin:0 auto;padding:1.2rem;}
.cart-item{background:white;border:1.5px solid var(--bdr);border-radius:10px;padding:1rem;display:flex;gap:12px;align-items:flex-start;margin-bottom:0.8rem;}
.cart-item-info{flex:1;}
.cart-item-name{font-family:'Barlow';font-weight:700;font-size:0.9rem;margin-bottom:2px;}
.cart-item-meta{font-size:0.72rem;color:var(--mut);margin-bottom:6px;}
.cart-item-price{font-family:'Barlow';font-weight:900;font-size:1.1rem;color:var(--dark);}
.cart-qty{display:flex;align-items:center;gap:8px;}
.qty-btn{width:28px;height:28px;border:1.5px solid var(--bdr);border-radius:5px;background:white;cursor:pointer;font-size:1rem;font-weight:700;display:flex;align-items:center;justify-content:center;}
.qty-btn:hover{border-color:var(--red);color:var(--red);}
.cart-summary{background:white;border:1.5px solid var(--bdr);border-radius:10px;padding:1.2rem;}
.summary-row{display:flex;justify-content:space-between;padding:6px 0;font-size:0.85rem;border-bottom:1px solid var(--bdr);}
.summary-row:last-of-type{border-bottom:none;}
.summary-row.total{font-family:'Barlow';font-weight:900;font-size:1rem;padding-top:10px;margin-top:4px;border-top:2px solid var(--dark);}
/* AI BOX */
.aibox{background:var(--dark);border-radius:9px;padding:1.1rem;margin-top:0.9rem;border-left:4px solid var(--red);}
.aiconf{font-size:0.62rem;font-weight:700;padding:2px 8px;border-radius:99px;text-transform:uppercase;font-family:'JetBrains Mono';}
.aiconf.high{background:rgba(21,128,61,0.2);color:#4ade80;border:1px solid rgba(21,128,61,0.4);}
.aiconf.medium{background:rgba(206,17,38,0.2);color:#ff9090;border:1px solid rgba(206,17,38,0.3);}
.aiconf.low{background:rgba(255,200,0,0.12);color:#fbbf24;border:1px solid rgba(255,200,0,0.3);}
.ainm{font-family:'Barlow';font-size:1.1rem;font-weight:900;color:white;margin-top:3px;}
.aitags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.aitag{font-size:0.65rem;font-family:'JetBrains Mono';background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);border-radius:4px;padding:2px 7px;color:#ccc;}
.ainotes{margin-top:7px;font-size:0.77rem;color:#888;line-height:1.5;}
.hlbanner{background:rgba(206,17,38,0.05);border:1.5px solid rgba(206,17,38,0.18);border-radius:7px;padding:0.5rem 1rem;margin-bottom:0.9rem;font-size:0.78rem;color:var(--red);font-weight:700;}
.not-found-box{background:white;border:2px dashed var(--bdr);border-radius:12px;padding:1.5rem;text-align:center;margin-top:1rem;}
.rfq-form{background:var(--surf2);border-radius:9px;padding:1rem;text-align:left;margin-top:0.8rem;}
.rfq-sent{background:var(--grn2);border:1.5px solid var(--grn);border-radius:9px;padding:1rem;text-align:center;}
.loading{display:flex;align-items:center;gap:9px;color:var(--red);font-size:0.82rem;padding:0.8rem 0;font-weight:600;}
.spin{width:15px;height:15px;border:2px solid var(--bdr);border-top-color:var(--red);border-radius:50%;animation:sp 0.65s linear infinite;flex-shrink:0;}
@keyframes sp{to{transform:rotate(360deg);}}
.dzone{border:2px dashed var(--bdr);border-radius:9px;padding:1.2rem;text-align:center;cursor:pointer;background:var(--surf2);}
.dzone.drag{border-color:var(--red);background:rgba(206,17,38,0.03);}
.dzone img{max-height:110px;border-radius:7px;object-fit:cover;}
.sport{max-width:700px;margin:0 auto;padding:1.2rem;}
.sport-hero{background:var(--dark);border-radius:12px;padding:1.5rem;margin-bottom:1.2rem;border-bottom:3px solid var(--red);}
.sport-hero h2{font-family:'Barlow';font-weight:900;font-size:1.3rem;color:white;margin-bottom:4px;}
.sport-hero p{color:#999;font-size:0.85rem;}
.pending-card{background:white;border:1.5px solid #f59e0b;border-left:4px solid #f59e0b;border-radius:10px;padding:1rem;margin-bottom:0.8rem;}
/* DOCUMENT STYLES (PDF) */
.doc-wrap{max-width:800px;margin:0 auto;padding:1.2rem;}
.doc-actions{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;}
/* Quotation / Invoice PDF appearance */
.pdf-doc{background:white;border:1px solid var(--bdr);border-radius:8px;overflow:hidden;margin-bottom:1rem;font-family:'Barlow',sans-serif;}
.pdf-topbar{height:8px;background:var(--red);}
.pdf-body{padding:2rem;}
.pdf-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.5rem;padding-bottom:1.2rem;border-bottom:2px solid var(--bdr);}
.pdf-logo{font-family:'Barlow';font-weight:900;font-size:1.8rem;color:var(--dark);letter-spacing:-1px;}
.pdf-logo span{color:var(--red);font-style:italic;}
.pdf-logo-sub{font-size:0.68rem;color:var(--mut);font-family:'JetBrains Mono';margin-top:2px;}
.pdf-right{text-align:right;}
.pdf-doc-type{font-family:'Barlow';font-weight:900;font-size:1.4rem;text-transform:uppercase;letter-spacing:2px;}
.pdf-doc-type.quotation{color:var(--gold);}
.pdf-doc-type.invoice{color:var(--red);}
.pdf-doc-type.paid{color:var(--grn);}
.pdf-ref{font-family:'JetBrains Mono';font-size:0.78rem;color:var(--mut);margin-top:4px;}
.pdf-date{font-family:'JetBrains Mono';font-size:0.72rem;color:var(--mut);margin-top:2px;}
.pdf-status-badge{margin-top:6px;display:inline-block;font-size:0.62rem;font-weight:700;padding:2px 10px;border-radius:4px;text-transform:uppercase;font-family:'JetBrains Mono';}
.badge-quot{background:rgba(180,83,9,0.1);color:var(--gold);border:1px solid rgba(180,83,9,0.3);}
.badge-paid{background:rgba(21,128,61,0.1);color:var(--grn);border:1px solid rgba(21,128,61,0.3);}
.badge-pending{background:rgba(206,17,38,0.1);color:var(--red);border:1px solid rgba(206,17,38,0.3);}
.pdf-parties{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1.5rem;}
.pdf-party-lbl{font-size:0.6rem;font-weight:700;letter-spacing:0.12em;color:var(--mut);text-transform:uppercase;margin-bottom:5px;font-family:'JetBrains Mono';}
.pdf-party-name{font-family:'Barlow';font-weight:700;font-size:0.92rem;}
.pdf-party-detail{font-size:0.73rem;color:var(--mut);margin-top:2px;}
.pdf-table{width:100%;border-collapse:collapse;margin-bottom:1.2rem;font-size:0.82rem;}
.pdf-table thead tr{background:var(--dark);color:white;}
.pdf-table th{padding:9px 12px;text-align:left;font-size:0.65rem;text-transform:uppercase;letter-spacing:0.06em;font-family:'JetBrains Mono';}
.pdf-table td{padding:10px 12px;border-bottom:1px solid var(--bdr);}
.pdf-table tr:nth-child(even) td{background:#fafafa;}
.pdf-totals{display:flex;justify-content:flex-end;margin-bottom:1rem;}
.pdf-totals-box{min-width:270px;}
.pdf-total-row{display:flex;justify-content:space-between;padding:5px 0;font-size:0.83rem;border-bottom:1px solid var(--bdr);}
.pdf-total-row.grand{font-family:'Barlow';font-weight:900;font-size:1rem;padding-top:8px;margin-top:4px;border-top:2px solid var(--dark);border-bottom:none;}
.pdf-benefit-box{background:var(--gold2);border:1.5px solid var(--gold);border-radius:9px;padding:1rem;margin-bottom:1rem;}
.pdf-benefit-title{font-family:'Barlow';font-weight:700;font-size:0.85rem;color:var(--gold);margin-bottom:0.5rem;text-transform:uppercase;letter-spacing:0.05em;}
.pdf-benefit-detail{font-size:0.8rem;color:#92400e;line-height:1.7;}
.pdf-footer{margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:0.8rem;}
.pdf-footer-note{font-size:0.68rem;color:var(--mut);line-height:1.6;}
.pdf-bottombar{height:6px;background:var(--red);}
/* GARAGE CUSTOMER INVOICE — clean, no margins visible */
.cust-inv{background:white;border:1px solid var(--bdr);border-radius:8px;overflow:hidden;font-family:'Barlow',sans-serif;}
.cust-inv-topbar{height:8px;background:var(--dark);}
.cust-inv-body{padding:2rem;}
.cust-inv-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.5rem;padding-bottom:1.2rem;border-bottom:2px solid var(--bdr);}
.cust-inv-garage-name{font-family:'Barlow';font-weight:900;font-size:1.5rem;color:var(--dark);}
.cust-inv-garage-sub{font-size:0.72rem;color:var(--mut);margin-top:3px;}
.cust-inv-right{text-align:right;}
.cust-inv-title{font-family:'Barlow';font-weight:900;font-size:1.3rem;color:var(--dark);text-transform:uppercase;letter-spacing:2px;}
.cust-inv-ref{font-family:'JetBrains Mono';font-size:0.75rem;color:var(--mut);margin-top:4px;}
.cust-inv-bottombar{height:6px;background:var(--dark);}
/* INVOICE TOOL */
.inv-wrap{max-width:860px;margin:0 auto;padding:1.2rem;}
.inv-lock{background:var(--dark);border-radius:12px;padding:2rem;text-align:center;border:2px solid var(--gold);}
.ref-input{background:#1a1a1a;border:2px solid #333;border-radius:7px;padding:10px 14px;color:white;font-family:'JetBrains Mono';font-size:1rem;outline:none;flex:1;letter-spacing:0.1em;}
.ref-input:focus{border-color:var(--gold);}
.ref-error{color:#ff9090;font-size:0.75rem;margin-top:5px;font-family:'JetBrains Mono';}

.ref-step-num{width:22px;height:22px;border-radius:50%;background:var(--gold);color:white;display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:700;flex-shrink:0;margin-top:1px;}
.inv-profit-note{background:var(--grn2);border:1px solid var(--grn);border-radius:7px;padding:0.75rem;font-size:0.78rem;color:var(--grn);font-weight:600;margin-bottom:0.8rem;}
/* ADMIN */
.admin-wrap{max-width:1100px;margin:0 auto;padding:1.2rem;}
.admin-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:0.8rem;margin-bottom:1.2rem;}
.admin-stat{background:white;border-radius:8px;padding:0.8rem;border:1px solid var(--bdr);}
.admin-stat-lbl{font-size:0.6rem;font-family:'JetBrains Mono';color:var(--mut);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px;}
.admin-stat-val{font-family:'Barlow';font-weight:900;font-size:1rem;}
.admin-qt-row{padding:0.8rem 1.2rem;border-bottom:1px solid var(--bdr);display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:0.5rem;align-items:center;}

.admin-lbl{font-size:0.6rem;color:var(--mut);font-family:'JetBrains Mono';text-transform:uppercase;display:block;margin-bottom:1px;}
/* TOAST */
.toast{position:fixed;bottom:1.2rem;right:1.2rem;background:var(--dark);color:white;padding:0.8rem 1.1rem;border-radius:8px;font-size:0.8rem;z-index:9999;animation:su 0.25s ease;border-left:3px solid var(--red);font-weight:600;max-width:300px;}
@keyframes su{from{transform:translateY(16px);opacity:0;}to{transform:translateY(0);opacity:1;}}
/* MEMBER LOCK BANNER */
.lock-banner{background:var(--dark2);border:1.5px solid var(--gold);border-radius:10px;padding:1rem 1.2rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.2rem;flex-wrap:wrap;}

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
// ── NATIVE PDF GENERATION (pure jsPDF — no DOM screenshotting, no CDN image-render
// quirks. Draws the document directly so it's always clean, single-page when it fits,
// and can NEVER accidentally include on-screen editing panels or margin data.) ────
var PDF_RED="#CE1126",PDF_DARK="#111111",PDF_MUT="#777777",PDF_GOLD="#b45309",PDF_GRN="#15803d",PDF_BDR="#e0e0e0";
var PAGE_W=210,PAGE_H=297,MARGIN=15,CONTENT_W=PAGE_W-MARGIN*2;

function pdfReady(){return typeof window.jspdf!=="undefined";}

function newPdfDoc(){
  var jsPDFCtor=window.jspdf.jsPDF;
  return new jsPDFCtor({orientation:"p",unit:"mm",format:"a4"});
}

function pdfHeader(doc,docType,ref,dateStr,statusText,statusColor){
  doc.setFont("helvetica","bold");doc.setFontSize(19);doc.setTextColor(PDF_DARK);
  doc.text("Wasel",MARGIN,22);
  var w1=doc.getTextWidth("Wasel ");
  doc.setTextColor(PDF_RED);doc.text("Auto",MARGIN+w1,22);
  doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(PDF_MUT);
  doc.text("wasel-auto.vercel.app  ·  +973 3384 4859",MARGIN,28);
  doc.text("waselauto26@gmail.com  ·  Manama, Bahrain",MARGIN,32.5);

  doc.setFont("helvetica","bold");doc.setFontSize(15);doc.setTextColor(PDF_RED);
  doc.text(docType,PAGE_W-MARGIN,20,{align:"right"});
  doc.setFont("courier","normal");doc.setFontSize(9);doc.setTextColor(PDF_DARK);
  doc.text(ref,PAGE_W-MARGIN,25.5,{align:"right"});
  doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(PDF_MUT);
  doc.text(dateStr,PAGE_W-MARGIN,30,{align:"right"});
  if(statusText){
    doc.setFillColor(statusColor);
    var sw=doc.getTextWidth(statusText)+6;
    doc.roundedRect(PAGE_W-MARGIN-sw,32.5,sw,5.5,1.2,1.2,"F");
    doc.setFont("helvetica","bold");doc.setFontSize(6.5);doc.setTextColor("#ffffff");
    doc.text(statusText,PAGE_W-MARGIN-sw/2,36.2,{align:"center"});
  }
  doc.setDrawColor(PDF_RED);doc.setLineWidth(1);
  doc.line(MARGIN,41,PAGE_W-MARGIN,41);
  return 41;
}

function pdfParties(doc,y,fromName,fromLines,toLabel,toName,toLines){
  doc.setFont("helvetica","bold");doc.setFontSize(7);doc.setTextColor(PDF_MUT);
  doc.text("FROM",MARGIN,y+7);
  doc.text(toLabel,MARGIN+95,y+7);
  doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(PDF_DARK);
  doc.text(fromName,MARGIN,y+13);
  doc.text(toName,MARGIN+95,y+13);
  doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(PDF_MUT);
  var yy=y+18;
  fromLines.forEach(function(l){doc.text(l,MARGIN,yy);yy+=4.2;});
  var yy2=y+18;
  toLines.forEach(function(l){doc.text(l,MARGIN+95,yy2);yy2+=4.2;});
  return y+18+Math.max(fromLines.length,toLines.length)*4.2+4;
}

function pdfTableHeader(doc,y,cols){
  doc.setFillColor(PDF_DARK);
  doc.rect(MARGIN,y,CONTENT_W,7,"F");
  doc.setFont("helvetica","bold");doc.setFontSize(6.8);doc.setTextColor("#ffffff");
  var x=MARGIN+2;
  cols.forEach(function(c){
    doc.text(c.label,x,y+4.6,{align:c.align||"left"});
    x+=c.w;
  });
  return y+7;
}

function pdfFooter(doc,pageNum,totalPages){
  doc.setFont("helvetica","normal");doc.setFontSize(6.5);doc.setTextColor(PDF_MUT);
  doc.text("Parts sourced through Wasel Auto — Bahrain's Auto Parts Marketplace",MARGIN,PAGE_H-10);
  doc.text("wasel-auto.vercel.app  ·  +973 3384 4859",MARGIN,PAGE_H-6.5);
  doc.text("Page "+pageNum+" of "+totalPages,PAGE_W-MARGIN,PAGE_H-6.5,{align:"right"});
}

function buildQuotationPDF(qt){
  var doc=newPdfDoc();
  var isInvoice=qt.status==="paid";
  var statusText=isInvoice?"PAID":qt.status==="pending_payment"?"AWAITING PAYMENT":"PENDING";
  var statusColor=isInvoice?PDF_GRN:qt.status==="pending_payment"?PDF_GOLD:PDF_RED;
  var y=pdfHeader(doc,isInvoice?"INVOICE":"QUOTATION",qt.ref,qt.date,statusText,statusColor);
  if(qt.invoiceNum){
    doc.setFont("helvetica","bold");doc.setFontSize(8);doc.setTextColor(PDF_GRN);
    doc.text("Invoice: "+qt.invoiceNum,PAGE_W-MARGIN,y-3,{align:"right"});
  }
  y=pdfParties(doc,y,"Wasel Auto",["Manama, Kingdom of Bahrain","+973 3384 4859"],"BILL TO",qt.garage.name,[qt.garage.phone,qt.garage.address?("Deliver to: "+qt.garage.address):""].filter(Boolean));

  var cols=[
    {label:"DESCRIPTION",w:52,align:"left"},
    {label:"BRAND",w:24,align:"left"},
    {label:"CATEGORY",w:24,align:"left"},
    {label:"WARRANTY",w:22,align:"left"},
    {label:"QTY",w:12,align:"center"},
    {label:"UNIT",w:22,align:"right"},
    {label:"TOTAL",w:22,align:"right"},
  ];
  var pageNum=1;
  y=pdfTableHeader(doc,y,cols);
  doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(PDF_DARK);
  qt.items.forEach(function(item){
    var descLines=doc.splitTextToSize(item.name,cols[0].w-3);
    var rowH=Math.max(7,descLines.length*4+3);
    if(y+rowH>PAGE_H-30){
      doc.addPage();pageNum++;y=MARGIN;
      y=pdfTableHeader(doc,y,cols);
      doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(PDF_DARK);
    }
    var x=MARGIN+2;
    doc.text(descLines,x,y+4.5);x+=cols[0].w;
    doc.text(item.brand||"",x,y+4.5);x+=cols[1].w;
    doc.text(item.cat||"",x,y+4.5);x+=cols[2].w;
    doc.text(item.warranty||"",x,y+4.5);x+=cols[3].w;
    doc.text(String(item.qty),x+cols[4].w-2,y+4.5,{align:"right"});x+=cols[4].w;
    doc.text(item.unitPrice.toFixed(3),x+cols[5].w-2,y+4.5,{align:"right"});x+=cols[5].w;
    doc.text(item.total.toFixed(3),x+cols[6].w-2,y+4.5,{align:"right"});
    doc.setDrawColor(PDF_BDR);doc.setLineWidth(0.2);
    doc.line(MARGIN,y+rowH,PAGE_W-MARGIN,y+rowH);
    y+=rowH;
  });
  y+=4;
  if(y>PAGE_H-60){doc.addPage();pageNum++;y=MARGIN;}
  var totalsX=PAGE_W-MARGIN-55;
  doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(PDF_MUT);
  doc.text("Subtotal",totalsX,y+5);
  doc.text(qt.subtotal.toFixed(3)+" BHD",PAGE_W-MARGIN,y+5,{align:"right"});
  doc.text("Service Fee ("+((qt.serviceFeeRate||4.5))+"%)",totalsX,y+10.5);
  doc.text(qt.serviceFee.toFixed(3)+" BHD",PAGE_W-MARGIN,y+10.5,{align:"right"});
  doc.setDrawColor(PDF_DARK);doc.setLineWidth(0.3);
  doc.line(totalsX,y+13.5,PAGE_W-MARGIN,y+13.5);
  doc.setFont("helvetica","bold");doc.setFontSize(11);doc.setTextColor(PDF_DARK);
  doc.text("TOTAL DUE",totalsX,y+20);
  doc.setTextColor(PDF_RED);
  doc.text(qt.total.toFixed(3)+" BHD",PAGE_W-MARGIN,y+20,{align:"right"});
  y+=28;

  if(!isInvoice){
    if(y>PAGE_H-70){doc.addPage();pageNum++;y=MARGIN;}
    doc.setFillColor("#fef3c7");doc.setDrawColor(PDF_GOLD);doc.setLineWidth(0.4);
    var boxH=38;
    doc.roundedRect(MARGIN,y,CONTENT_W,boxH,2,2,"FD");
    doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor("#92400e");
    doc.text("PAYMENT INSTRUCTIONS — BENEFIT PAY",MARGIN+5,y+7);
    doc.setFont("helvetica","normal");doc.setFontSize(7.8);
    var lines=[
      "Please pay 100% in advance — the full amount of "+qt.total.toFixed(3)+" BHD — via Benefit Pay to:",
      "Account Number: +973 3384 4859      Account Name: Sahaam",
      "IMPORTANT: In the payment reference or note, write: "+qt.ref,
      "Then WhatsApp your payment screenshot to +973 3384 4859 with this reference number.",
      "We will confirm and send your Invoice Number and Invoice PIN within 1–2 hours.",
    ];
    var ly=y+14;
    lines.forEach(function(l){doc.text(l,MARGIN+5,ly);ly+=5.2;});
  }

  var totalPages=doc.internal.getNumberOfPages();
  for(var i=1;i<=totalPages;i++){doc.setPage(i);pdfFooter(doc,i,totalPages);}
  return doc;
}

function buildInvoicePDF(garageName,garageContact,invGarage,items,note){
  var doc=newPdfDoc();
  var y=pdfHeader(doc,"INVOICE",today(),new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}).toUpperCase(),null,null);
  // overwrite left header block with garage identity instead of Wasel Auto (this is the garage's own invoice to their customer)
  doc.setFillColor("#ffffff");doc.rect(MARGIN,10,95,25,"F");
  doc.setFont("helvetica","bold");doc.setFontSize(17);doc.setTextColor(PDF_DARK);
  doc.text(garageName||"Your Garage",MARGIN,20);
  doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(PDF_MUT);
  if(garageContact)doc.text("Contact: "+garageContact,MARGIN,26);

  y=pdfParties(doc,y,null,[],"BILL TO",invGarage.name||"Customer",[invGarage.phone||"",invGarage.vehicle?("Vehicle: "+invGarage.vehicle):"",invGarage.plate?("Plate: "+invGarage.plate):""].filter(Boolean));

  var cols=[
    {label:"DESCRIPTION",w:96,align:"left"},
    {label:"QTY",w:22,align:"center"},
    {label:"UNIT PRICE BHD",w:31,align:"right"},
    {label:"TOTAL BHD",w:31,align:"right"},
  ];
  var pageNum=1;
  y=pdfTableHeader(doc,y,cols);
  doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(PDF_DARK);
  var grandTotal=0;
  items.forEach(function(item){
    var sell=item.cost*(1+(item.margin||0)/100);
    var lineTotal=sell*item.qty;
    grandTotal+=lineTotal;
    var descLines=doc.splitTextToSize(item.desc,cols[0].w-3);
    var rowH=Math.max(7,descLines.length*4+3);
    if(y+rowH>PAGE_H-30){
      doc.addPage();pageNum++;y=MARGIN;
      y=pdfTableHeader(doc,y,cols);
      doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(PDF_DARK);
    }
    var x=MARGIN+2;
    doc.text(descLines,x,y+4.5);x+=cols[0].w;
    doc.text(String(item.qty),x+cols[1].w-2,y+4.5,{align:"right"});x+=cols[1].w;
    doc.text(sell.toFixed(3),x+cols[2].w-2,y+4.5,{align:"right"});x+=cols[2].w;
    doc.text(lineTotal.toFixed(3),x+cols[3].w-2,y+4.5,{align:"right"});
    doc.setDrawColor(PDF_BDR);doc.setLineWidth(0.2);
    doc.line(MARGIN,y+rowH,PAGE_W-MARGIN,y+rowH);
    y+=rowH;
  });
  y+=6;
  if(y>PAGE_H-45){doc.addPage();pageNum++;y=MARGIN;}
  var totalsX=PAGE_W-MARGIN-55;
  doc.setDrawColor(PDF_DARK);doc.setLineWidth(0.3);
  doc.line(totalsX,y,PAGE_W-MARGIN,y);
  doc.setFont("helvetica","bold");doc.setFontSize(11);doc.setTextColor(PDF_DARK);
  doc.text("TOTAL",totalsX,y+7);
  doc.text(grandTotal.toFixed(3)+" BHD",PAGE_W-MARGIN,y+7,{align:"right"});
  y+=16;
  if(note){
    doc.setFont("helvetica","normal");doc.setFontSize(7.8);doc.setTextColor(PDF_MUT);
    var noteLines=doc.splitTextToSize(note,CONTENT_W-6);
    if(y+noteLines.length*4.2+8>PAGE_H-25){doc.addPage();pageNum++;y=MARGIN;}
    doc.setFillColor("#f0f0f0");
    doc.rect(MARGIN,y,CONTENT_W,noteLines.length*4.2+6,"F");
    doc.text(noteLines,MARGIN+4,y+6);
    y+=noteLines.length*4.2+10;
  }
  doc.setFont("helvetica","normal");doc.setFontSize(7.5);doc.setTextColor(PDF_MUT);
  doc.text("Thank you for your business.",MARGIN,y+2);

  var totalPages=doc.internal.getNumberOfPages();
  for(var i=1;i<=totalPages;i++){doc.setPage(i);pdfFooter(doc,i,totalPages);}
  return doc;
}

function genRef(prefix){

  var y=now.getFullYear().toString().slice(-2);
  var m=String(now.getMonth()+1).padStart(2,"0");
  var d=String(now.getDate()).padStart(2,"0");
  return (prefix||"WA")+"-"+y+m+d+"-"+Math.floor(Math.random()*9000+1000);
}

// ── DOM HELPERS ───────────────────────────────────────────────────────
function el(tag,attrs,children){
  var e=document.createElement(tag);
  if(attrs){
    Object.keys(attrs).forEach(function(k){
      if(k==="className")e.className=attrs[k];
      else if(k==="style"&&typeof attrs[k]==="object")Object.assign(e.style,attrs[k]);
      else if(k.startsWith("on")&&typeof attrs[k]==="function")e.addEventListener(k.slice(2).toLowerCase(),attrs[k]);
      else if(["href","target","rel","placeholder","type","dir","rows","maxlength","step","min","max","accept"].includes(k))e.setAttribute(k,attrs[k]);
      else if(k==="value")e.value=attrs[k];
      else if(k==="disabled")e.disabled=attrs[k];
      else if(k==="checked")e.checked=attrs[k];
      else e.setAttribute(k,attrs[k]);
    });
  }
  if(children)(Array.isArray(children)?children:[children]).forEach(function(c){
    if(c==null||c===false)return;
    if(typeof c==="string"||typeof c==="number")e.appendChild(document.createTextNode(String(c)));
    else e.appendChild(c);
  });
  return e;
}
function div(cls,children,extra){return el("div",Object.assign({className:cls||""},extra||{}),children);}
function span(cls,txt,extra){return el("span",Object.assign({className:cls||""},extra||{}),[txt]);}
function btn(cls,txt,onclick,disabled){return el("button",{className:"btn "+(cls||""),onClick:onclick,disabled:!!disabled},[txt]);}
function inp(cls,ph,val,onchange,extra){
  var e=el("input",Object.assign({className:"ifield "+(cls||""),placeholder:ph||"",value:val||""},extra||{}));
  if(onchange)e.addEventListener("input",function(){onchange(e.value);});
  return e;
}
function seldrop(cls,opts,val,onchange){
  var e=el("select",{className:"sel "+(cls||"")});
  opts.forEach(function(o){var opt=el("option",{value:o.val!==undefined?o.val:o.label},[o.label]);if((o.val!==undefined?o.val:o.label)===val)opt.selected=true;e.appendChild(opt);});
  e.addEventListener("change",function(){onchange(e.value);});
  return e;
}
function ig(lbl,input){var d=div("ig");d.appendChild(el("label",{className:"il"},[lbl]));d.appendChild(input);return d;}
function pill(txt,onclick,active){return el("button",{className:"pill"+(active?" on":""),onClick:onclick},[txt]);}
function fsecT(txt){return el("div",{className:"fsec-t"},[txt]);}

function buildQTWhatsApp(qt){
  var lines=["Hi Wasel Auto, here is my quotation request:","Ref: "+qt.ref,"Garage: "+(qt.garage.name||""),"Phone: "+(qt.garage.phone||""),""];
  qt.items.forEach(function(it){lines.push("• "+it.name+" x"+it.qty+" — "+it.total.toFixed(3)+" BHD");});
  lines.push("","Subtotal: "+qt.subtotal.toFixed(3)+" BHD");
  lines.push("Service Fee: "+qt.serviceFee.toFixed(3)+" BHD");
  lines.push("TOTAL: "+qt.total.toFixed(3)+" BHD");
  lines.push("Deliver to: "+(qt.garage.address||"—"));
  if(qt.garage.notes)lines.push("Notes: "+qt.garage.notes);

// ── VIN DECODE (free, static WMI prefix table — no API cost) ───────────
var VIN_WMI = {
  "JTD":"Toyota","JTM":"Toyota","JTN":"Toyota","JTE":"Toyota","JT":"Toyota",
  "JN1":"Nissan","JN6":"Nissan","JN8":"Nissan","JN":"Nissan",
  "WBA":"BMW","WBS":"BMW","WBY":"BMW","WBX":"BMW",
  "WDD":"Mercedes","WDC":"Mercedes","WDB":"Mercedes","WDF":"Mercedes",
  "1HG":"Honda","JHM":"Honda","SHH":"Honda","SHS":"Honda",
  "1FA":"Ford","1FM":"Ford","1FT":"Ford","MAJ":"Ford",
};
function decodeVinMake(vin){
  vin=(vin||"").toUpperCase().replace(/\s/g,"");
  if(vin.length<2)return null;
  if(VIN_WMI[vin.slice(0,3)])return VIN_WMI[vin.slice(0,3)];
  if(VIN_WMI[vin.slice(0,2)])return VIN_WMI[vin.slice(0,2)];

// ── AI PART FINDER (free rule-based matcher — VIN prefix + keyword scoring) ────
// IMPORTANT: this does NOT read photos — true image recognition needs a paid vision
// model. A description is what actually drives matching; photos are attached to the
// WhatsApp handoff for manual human confirmation instead of a fake "AI" claim.
function doAI(){
  if(!S.vin&&!S.desc&&!S.imgB64)return;
  S.aiLoad=true;S.aiRes=null;S.hls=[];S.showRFQ=false;render();
  setTimeout(function(){
    var pool=allParts();
    var vinMake=S.vin?decodeVinMake(S.vin):null;
    if(vinMake)pool=pool.filter(function(p){return p.make===vinMake||p.make==="Universal";});
    var kw=(S.desc||"").toLowerCase().split(/\s+/).filter(function(w){return w.length>1;});
    function score(p){
      var s=0,kwHit=false;
      if(vinMake&&p.make===vinMake)s+=3;
      if(kw.length){
        var hay=(p.name+" "+p.nameAr+" "+p.cat+" "+p.make+" "+p.model+" "+p.brand).toLowerCase();
        kw.forEach(function(w){if(hay.indexOf(w)>-1){s+=2;kwHit=true;}});
      }
      return{s:s,kwHit:kwHit};
    }
    var scored=pool.map(function(p){var sc=score(p);return{p:p,s:sc.s,kwHit:sc.kwHit};}).filter(function(x){
      // if a description was typed, it must actually text-match — a VIN match alone isn't enough once the person said what they need
      return kw.length>0?x.kwHit:x.s>0;
    });
    scored.sort(function(a,b){return b.s-a.s;});
    var matches=scored.map(function(x){return x.p;}).slice(0,8);
    S.hls=matches.map(function(p){return p.id;});
    var makesFound=[],modelsFound=[];
    matches.forEach(function(p){
      if(p.make!=="Universal"&&makesFound.indexOf(p.make)===-1)makesFound.push(p.make);
      if(p.model!=="All"&&modelsFound.indexOf(p.model)===-1)modelsFound.push(p.model);
    });
    var yrs=matches.filter(function(p){return p.make!=="Universal";});
    var yearRange=yrs.length?{from:Math.min.apply(null,yrs.map(function(p){return p.yf;})),to:Math.max.apply(null,yrs.map(function(p){return p.yt;}))}:null;

    var hasDesc=kw.length>0;
    var label,guessName;
    if(hasDesc){label="AI MATCHED";guessName=S.desc;}
    else if(vinMake){label="COMPATIBLE WITH YOUR VEHICLE";guessName=vinMake+" — parts in this vehicle's range";}
    else{label="PHOTO RECEIVED";guessName="Awaiting description";}

    var notes=[];
    if(vinMake)notes.push("VIN suggests "+vinMake+".");
    else if(S.vin)notes.push("Couldn't identify the make from this VIN — try adding a text description too.");
    if(S.imgB64&&!hasDesc)notes.push("We can't auto-read part photos yet (that needs a paid AI vision model) — type a short description above (e.g. \"fuel pump\") for an exact match, or submit the request below and our team will check your photo manually over WhatsApp.");
    else if(S.imgB64)notes.push("Photo attached — our team will visually confirm the exact match over WhatsApp.");
    if(!hasDesc&&vinMake)notes.push("These are all parts compatible with your vehicle, not a specific match — add a description to narrow it down.");
    if(matches.length===0)notes.push("No match in our current catalogue — submit a request below and we'll source it from our supplier network in Bahrain, UAE & KSA.");

    var confidence;
    if(matches.length===0)confidence="low";
    else if(hasDesc&&matches.length<=2)confidence="high";
    else if(hasDesc)confidence="medium";
    else confidence="low";

    S.aiRes={
      label:label,partName:guessName,partNameAr:guessName,
      confidence:confidence,
      makes:makesFound,models:modelsFound,yearRange:yearRange,
      notes:notes.join(" "),
    };
    S.showRFQ=matches.length===0||!hasDesc;
    S.aiLoad=false;render();
  },600);
}

// ── BULK PART LIST PARSING ──────────────────────────────────────────
// Handles pasted enquiry lists like: "1  Piston  _" or "Spark Plugs x4" or "AC Delco Sealant  3 Pcs"
function parseBulkLine(raw){
  var line=raw;
  line=line.replace(/^\s*(sr\.?\s*no\.?|item)?\s*\d+[\.\):\-]?\s*/i,"");
  var qty=1;
  var parts=line.split(/\t|\s{2,}/).map(function(s){return s.trim();}).filter(Boolean);
  if(parts.length>1){
    var last=parts[parts.length-1];
    if(/^\d+$/.test(last)){qty=parseInt(last)||1;parts.pop();}
    else if(/^x?\s*\d+\s*(pcs|pieces|units)?\.?$/i.test(last)){qty=parseInt(last.replace(/\D/g,""))||1;parts.pop();}
    else if(last==="_"||last==="-"){parts.pop();}
    line=parts.join(" ");
  } else {
    var m=line.match(/\s+x\s*(\d+)\s*$/i)||line.match(/\s+(\d+)\s*pcs\.?\s*$/i);
    if(m){qty=parseInt(m[1])||1;line=line.slice(0,m.index).trim();}
  }
  line=line.replace(/\s+/g," ").replace(/^[-_.\s]+|[-_.\s]+$/g,"").trim();
  return{desc:line,qty:qty||1};
}

function doBulkAI(){
  if(!S.bulkText||!S.bulkText.trim())return;
  S.aiLoad=true;S.bulkResults=null;render();
  setTimeout(function(){
    var pool=allParts();
    var vinMake=S.vin?decodeVinMake(S.vin):null;
    if(vinMake)pool=pool.filter(function(p){return p.make===vinMake||p.make==="Universal";});
    var lines=S.bulkText.split("\n").map(function(l){return l.trim();}).filter(Boolean);
    var results=lines.map(function(raw){
      var parsed=parseBulkLine(raw);
      if(!parsed.desc)return null;
      var kw=parsed.desc.toLowerCase().split(/\s+/).filter(function(w){return w.length>1;});
      var best=null,bestScore=0;
      pool.forEach(function(p){
        var hay=(p.name+" "+p.nameAr+" "+p.cat+" "+p.make+" "+p.model+" "+p.brand).toLowerCase();
        var s=0,hit=false;
        kw.forEach(function(w){if(hay.indexOf(w)>-1){s+=2;hit=true;}});
        if(vinMake&&p.make===vinMake)s+=1;
        if(hit&&s>bestScore){bestScore=s;best=p;}
      });
      return{query:raw.trim(),desc:parsed.desc,qty:parsed.qty,match:best,selected:!!best};
    }).filter(Boolean);
    S.bulkResults=results;
    S.aiLoad=false;render();
  },700);
}

    var row=div("",null,{style:{display:"flex",gap:"8px",flexWrap:"wrap"}});
    var refI=el("input",{className:"ref-input",placeholder:"e.g. QT-260804-8325"});refI.value=S.invRefInput;
    refI.addEventListener("input",function(){S.invRefInput=refI.value;});
    refI.addEventListener("keydown",function(e){if(e.key==="Enter")unlockInv();});
    row.appendChild(refI);
    var pinI=el("input",{className:"ref-input",placeholder:"Secret Invoice PIN",style:{maxWidth:"160px"}});pinI.value=S.invPinInput||"";
    pinI.addEventListener("input",function(){S.invPinInput=pinI.value;});
    pinI.addEventListener("keydown",function(e){if(e.key==="Enter")unlockInv();});
    row.appendChild(pinI);
    function unlockInv(){
      var ref=(S.invRefInput||"").trim().toUpperCase();
      var pin=(S.invPinInput||"").trim();
      if(!ref||!pin){S.invRefError="Please enter both the reference number and the Invoice PIN";render();return;}
      var log=getLog("wasel_quotations");
      var found=log.find(function(q){return q.ref.toUpperCase()===ref;});
      if(!found){S.invRefError="Reference not found. Check your quotation document.";render();return;}
      if(found.status!=="paid"){S.invRefError="This quotation hasn't been marked as paid yet — please wait for payment confirmation.";render();return;}
      if(!found.invoicePin||found.invoicePin!==pin){S.invRefError="Incorrect Invoice PIN. Check the message Wasel Auto sent you.";render();return;}
      S.invRef=found.ref;S.invNum=found.invoiceNum||"";
      S.invGarage={name:found.garage.name||"",phone:found.garage.phone||"",vehicle:found.garage.vehicle||"",plate:""};
      S.invItems=found.items.map(function(it){return{desc:it.name,cost:it.unitPrice,margin:it.margin!=null?it.margin:20,qty:it.qty};});
      S.invRefError="";S.invUnlocked=true;render();
    }
    row.appendChild(btn("btn-gold","Unlock",unlockInv));
    lock.appendChild(row);
    if(S.invRefError)lock.appendChild(el("div",{className:"ref-error"},[S.invRefError]));
    var stepsWrap=div("",null,{style:{marginTop:"1.2rem",textAlign:"left"}});
    ["Complete your parts order and pay via Benefit Pay","Wasel Auto confirms payment and sends your reference number + secret Invoice PIN","Enter both here to unlock your items — your margins from checkout carry over automatically","Adjust anything if needed — your customer only ever sees the final price"].forEach(function(s,i){
      var st=div("ref-step");
      st.appendChild(el("div",{className:"ref-step-num"},[String(i+1)]));
      st.appendChild(el("div",{},[s]));
      stepsWrap.appendChild(st);
    });
    lock.appendChild(stepsWrap);
    wrap.appendChild(lock);
    return wrap;
  }
  wrap.appendChild(btn("btn-gh btn-sm","🔓 "+S.invRef+" — Change Reference",function(){S.invUnlocked=false;S.invRefInput="";S.invPinInput="";S.invItems=[];render();}));
  var cp=div("panel",null,{style:{marginTop:"0.8rem"}});
  cp.appendChild(makePHead("👤","Customer Details","Shown on the invoice sent to your customer"));
  var cb2=div("pbody");
  var g0=div("fgrid");
  var ig1=S.invGarage;
  g0.appendChild(ig("Customer Name",inp("","Customer name",ig1.name,function(v){S.invGarage.name=v;})));
  g0.appendChild(ig("Customer Phone",inp("","+973 XXXX XXXX",ig1.phone,function(v){S.invGarage.phone=v;},{type:"tel",dir:"ltr"})));
  g0.appendChild(ig("Vehicle",inp("","e.g. Toyota Camry 2020",ig1.vehicle,function(v){S.invGarage.vehicle=v;})));
  g0.appendChild(ig("Plate Number",inp("","e.g. 12345",ig1.plate,function(v){S.invGarage.plate=v;})));
  cb2.appendChild(g0);cp.appendChild(cb2);wrap.appendChild(cp);

  var ip=div("panel");
  ip.appendChild(makePHead("📦","Items & Your Margin","Cost is what you paid Wasel Auto — margin is your profit, never shown to the customer"));
  var ib=div("pbody");
  var immRow=div("",null,{style:{display:"flex",gap:"6px",marginBottom:"0.9rem",alignItems:"center",flexWrap:"wrap"}});
  immRow.appendChild(el("span",{style:{fontSize:"0.75rem",color:"var(--mut)",fontWeight:"600"}},["Margin:"]));
  immRow.appendChild(btn(S.invMarginMode!=="overall"?"btn-r btn-sm":"btn-gh btn-sm","Per Item",function(){S.invMarginMode="item";render();}));
  immRow.appendChild(btn(S.invMarginMode==="overall"?"btn-r btn-sm":"btn-gh btn-sm","One Overall %",function(){
    S.invMarginMode="overall";
    S.invItems.forEach(function(i){i.margin=S.invOverallMargin!=null?S.invOverallMargin:20;});
    render();
  }));
  if(S.invMarginMode==="overall"){
    var iomInp=el("input",{type:"number",value:S.invOverallMargin!=null?S.invOverallMargin:20,style:{width:"60px",padding:"4px 7px",fontSize:"0.8rem",border:"1px solid var(--bdr)",borderRadius:"5px"}});
    iomInp.addEventListener("input",function(){
      S.invOverallMargin=parseFloat(iomInp.value)||0;
      S.invItems.forEach(function(i){i.margin=S.invOverallMargin;});
      render();
    });
    immRow.appendChild(iomInp);
    immRow.appendChild(el("span",{style:{fontSize:"0.75rem",color:"var(--mut)"}},["% applied to every item"]));
  }
  ib.appendChild(immRow);
  S.invItems.forEach(function(item,idx){
    var row=div("",null,{style:{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 0.7fr auto",gap:"8px",alignItems:"center",marginBottom:"8px",paddingBottom:"8px",borderBottom:"1px solid var(--bdr)"}});
    row.appendChild(inp("","Description",item.desc,function(v){item.desc=v;}));
    row.appendChild(inp("","Cost",item.cost,function(v){item.cost=parseFloat(v)||0;render();},{type:"number",step:"0.001"}));
    var mgInp=inp("","Margin %",item.margin,function(v){item.margin=parseFloat(v)||0;render();},{type:"number"});
    if(S.invMarginMode==="overall"){mgInp.disabled=true;mgInp.style.opacity="0.5";}
    row.appendChild(mgInp);
    row.appendChild(inp("","Qty",item.qty,function(v){item.qty=parseInt(v)||1;render();},{type:"number"}));
    row.appendChild(btn("btn-gh btn-sm","🗑",function(){S.invItems.splice(idx,1);render();}));
    ib.appendChild(row);
  });
  var addRow=div("",null,{style:{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 0.7fr auto",gap:"8px",alignItems:"center",marginTop:"6px"}});
  addRow.appendChild(inp("","New item description",S.invNewDesc,function(v){S.invNewDesc=v;}));
  addRow.appendChild(inp("","Cost",S.invNewCost,function(v){S.invNewCost=v;},{type:"number",step:"0.001"}));
  addRow.appendChild(inp("","Margin %",S.invNewMargin,function(v){S.invNewMargin=v;},{type:"number"}));
  addRow.appendChild(inp("","Qty",S.invNewQty,function(v){S.invNewQty=v;},{type:"number"}));
  addRow.appendChild(btn("btn-d btn-sm","＋",function(){
    if(!S.invNewDesc||!S.invNewCost){showToast("Enter description and cost");return;}
    S.invItems.push({desc:S.invNewDesc,cost:parseFloat(S.invNewCost)||0,margin:parseFloat(S.invNewMargin)||0,qty:parseInt(S.invNewQty)||1});
    S.invNewDesc="";S.invNewCost="";S.invNewMargin="20";S.invNewQty="1";render();
  }));
  ib.appendChild(addRow);
  ip.appendChild(ib);wrap.appendChild(ip);

  var np=div("panel");
  np.appendChild(makePHead("📝","Notes","Optional — shown on the customer invoice"));
  var nb=div("pbody");
  nb.appendChild(inp("","Any notes for the customer…",S.invNote,function(v){S.invNote=v;}));
  np.appendChild(nb);wrap.appendChild(np);

  var totalCost=S.invItems.reduce(function(a,i){return a+i.cost*i.qty;},0);
  var totalSell=S.invItems.reduce(function(a,i){return a+i.cost*(1+(i.margin||0)/100)*i.qty;},0);
  wrap.appendChild(el("div",{className:"inv-profit-note"},["💰 Your cost: "+fmtBHD(totalCost)+"  →  Customer pays: "+fmtBHD(totalSell)+"  →  Your profit: "+fmtBHD(totalSell-totalCost)]));
  wrap.appendChild(btn("btn-r btn-lg btn-full","⬇️ Download Customer Invoice PDF",function(){
    if(S.invItems.length===0){showToast("Add at least one item");return;}
    if(!pdfReady()){showToast("PDF tool still loading — please try again in a second");return;}
    showToast("Preparing your PDF…");
    try{
      var doc=buildInvoicePDF(S.member?S.member.garageName:"Your Garage",S.invGarage.phone,S.invGarage,S.invItems,S.invNote);
      doc.save("Wasel-Auto-Invoice-"+(S.invRef||"customer")+".pdf");
      showToast("✓ Downloaded");
    }catch(e){showToast("Couldn't build the PDF — try Print instead");}
  }));
  wrap.appendChild(btn("btn-gh btn-sm","🖨️ Print instead",function(){
    if(S.invItems.length===0){showToast("Add at least one item");return;}
    window.print();
  }));
  wrap.appendChild(renderCustomerInvoicePreview());
  return wrap;
}

// ── ADMIN DASHBOARD ───────────────────────────────────────────────────
function renderAdmin(){
  var wrap=div("admin-wrap");
  if(!S.adminAuth){
    var lock=div("member-gate",null,{style:{border:"2px solid var(--red)"}});
    lock.appendChild(el("div",{style:{fontSize:"2rem",marginBottom:"0.6rem"}},["⚙️"]));
    lock.appendChild(el("h2",{},["Admin Access"]));
    lock.appendChild(el("p",{},["Enter admin password to manage quotations, suppliers and part requests"]));
    var pw=el("input",{type:"password",className:"ref-input",placeholder:"Password",style:{marginBottom:"0.8rem",width:"100%"}});
    pw.value=S.adminPw;
    pw.addEventListener("input",function(){S.adminPw=pw.value;});
    function tryAdmin(){
      if(S.adminPw==="11Wasel@uto22"){S.adminAuth=true;S.adminPw="";render();}
      else{showToast("Incorrect password");}
    }
    pw.addEventListener("keydown",function(e){if(e.key==="Enter")tryAdmin();});
    lock.appendChild(pw);
    lock.appendChild(btn("btn-r btn-full","Unlock",tryAdmin));
    wrap.appendChild(lock);
    return wrap;
  }
  wrap.appendChild(el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1rem"}},[
    el("div",{style:{fontFamily:"'Barlow'",fontWeight:"900",fontSize:"1.2rem"}},["Admin Dashboard"]),
    btn("btn-gh btn-sm","Logout",function(){S.adminAuth=false;render();}),
  ]));
  var qLog=getLog("wasel_quotations");
  var pending=getLog("wasel_pending_parts");
  var rfqs=getLog("wasel_rfqs");
  var totalRev=qLog.filter(function(q){return q.status==="paid";}).reduce(function(a,q){return a+q.total;},0);
  var stats=div("admin-summary");
  [["Total Quotations",qLog.length],["Awaiting Payment",qLog.filter(function(q){return q.status==="pending_payment";}).length],["Paid Invoices",qLog.filter(function(q){return q.status==="paid";}).length],["Revenue (Paid)",totalRev.toFixed(3)+" BHD"]].forEach(function(s){
    var c=div("admin-stat");
    c.appendChild(el("div",{className:"admin-stat-lbl"},[s[0]]));
    c.appendChild(el("div",{className:"admin-stat-val"},[String(s[1])]));
    stats.appendChild(c);
  });
  wrap.appendChild(stats);

  var gp=div("panel");
  gp.appendChild(makePHead("🔑","Garage Members & PINs","Generate login PINs for real garages — they use this PIN + their garage name to log in"));
  var gb=div("pbody");
  var genPins=getLog("wasel_garage_pins");
  var allPinsList=MEMBER_PINS.concat(genPins);
  var glist=div("",null,{style:{marginBottom:"1rem"}});
  allPinsList.forEach(function(m,idx){
    var row=div("admin-qt-row",null,{style:{gridTemplateColumns:"1fr 1fr 1fr auto"}});
    row.appendChild(div("",[el("span",{className:"admin-lbl"},["Garage"]),el("div",{style:{fontSize:"0.8rem",fontWeight:"700"}},[m.garageName])]));
    row.appendChild(div("",[el("span",{className:"admin-lbl"},["PIN"]),el("div",{style:{fontFamily:"'JetBrains Mono'",fontSize:"0.85rem",fontWeight:"700",letterSpacing:"2px"}},[m.pin])]));
    row.appendChild(div("",[el("span",{className:"admin-lbl"},["Phone"]),el("div",{style:{fontSize:"0.78rem"}},[m.phone||""])]));
    var isBuiltIn=idx<MEMBER_PINS.length;
    if(isBuiltIn){
      row.appendChild(el("span",{style:{fontSize:"0.68rem",color:"var(--mut)"}},["Built-in"]));
    } else {
      row.appendChild(btn("btn-gh btn-sm","🗑 Remove",function(){
        var gIdx=idx-MEMBER_PINS.length;
        var updated=genPins.filter(function(x,i){return i!==gIdx;});
        saveLog("wasel_garage_pins",updated);render();
      }));
    }
    glist.appendChild(row);
  });
  gb.appendChild(glist);

  var newRow=div("fgrid");
  newRow.appendChild(ig("Garage Name",inp("","e.g. Al Manama Auto Repair",S._newPinGarage||"",function(v){S._newPinGarage=v;})));
  newRow.appendChild(ig("WhatsApp Phone",inp("","+973 XXXX XXXX",S._newPinPhone||"",function(v){S._newPinPhone=v;},{type:"tel",dir:"ltr"})));
  gb.appendChild(newRow);
  gb.appendChild(btn("btn-gold btn-full","🔑 Generate New PIN",function(){
    if(!S._newPinGarage){showToast("Enter a garage name first");return;}
    var existingPins=allMemberPins().map(function(m){return m.pin;});
    var pin;
    do{pin=String(Math.floor(1000+Math.random()*9000));}while(existingPins.indexOf(pin)>-1);
    var entry={pin:pin,garageName:S._newPinGarage,phone:S._newPinPhone||"",memberSince:today(),tier:"Member"};
    var log=getLog("wasel_garage_pins");log.push(entry);saveLog("wasel_garage_pins",log);
    S._newPinGarage="";S._newPinPhone="";
    showToast("✓ PIN "+pin+" created for "+entry.garageName+" — share it with them on WhatsApp");
    render();
  }));
  gp.appendChild(gb);wrap.appendChild(gp);

  var qp=div("panel");
  qp.appendChild(makePHead("📄","Quotations",qLog.length+" total"));
  var qb=div("pbody",null,{style:{padding:"0"}});
  if(qLog.length===0)qb.appendChild(el("div",{style:{padding:"1rem",color:"var(--mut)",fontSize:"0.85rem"}},["No quotations yet"]));
  qLog.forEach(function(q){
    var row=div("admin-qt-row");
    var c1=div("");c1.appendChild(el("span",{className:"admin-lbl"},["Ref"]));c1.appendChild(el("div",{style:{fontFamily:"'JetBrains Mono'",fontSize:"0.78rem",fontWeight:"700"}},[q.ref]));
    var c2=div("");c2.appendChild(el("span",{className:"admin-lbl"},["Garage"]));c2.appendChild(el("div",{style:{fontSize:"0.8rem"}},[q.garage.name||q.member]));
    var c3=div("");c3.appendChild(el("span",{className:"admin-lbl"},["Total / Status"]));c3.appendChild(el("div",{style:{fontSize:"0.8rem",fontWeight:"700"}},[q.total.toFixed(3)+" BHD — "+q.status]));
    row.appendChild(c1);row.appendChild(c2);row.appendChild(c3);
    var actions=div("",null,{style:{display:"flex",gap:"6px"}});
    if(q.status!=="paid"){
      actions.appendChild(btn("btn-grn btn-sm","Mark Paid",function(){
        var idx=qLog.findIndex(function(x){return x.ref===q.ref;});
        var pin=String(Math.floor(1000+Math.random()*9000));
        qLog[idx].status="paid";qLog[idx].invoiceNum=genRef("INV");qLog[idx].invoicePin=pin;
        saveLog("wasel_quotations",qLog);
        showToast("✓ Marked paid — Invoice "+qLog[idx].invoiceNum+" · PIN "+pin);render();
      }));
    } else {
      var paidInfo=div("",null,{style:{textAlign:"right"}});
      paidInfo.appendChild(el("div",{style:{fontSize:"0.7rem",color:"var(--grn)",fontWeight:"700"}},["✓ "+q.invoiceNum]));
      paidInfo.appendChild(el("div",{style:{fontSize:"0.68rem",color:"var(--mut)",fontFamily:"'JetBrains Mono'"}},["PIN: "+(q.invoicePin||"—")]));
      actions.appendChild(paidInfo);
      if(q.invoicePin){
        var pinMsg="Hi "+(q.garage.name||"")+", your Wasel Auto payment is confirmed ✅\n\nRef: "+q.ref+"\nInvoice Number: "+q.invoiceNum+"\nSecret Invoice PIN: "+q.invoicePin+"\n\nGo to My Invoices on the Wasel Auto app, enter both to build and download your customer invoice.";
        actions.appendChild(el("a",{href:"https://wa.me/"+(q.garage.phone||"").replace(/[^0-9]/g,"")+"?text="+encodeURIComponent(pinMsg),target:"_blank",rel:"noopener",className:"btn btn-wa btn-sm"},["💬 Send PIN"]));
      }
    }
    row.appendChild(actions);
    qb.appendChild(row);
  });
  qp.appendChild(qb);wrap.appendChild(qp);

  var sp=div("panel");
  sp.appendChild(makePHead("➕","Pending Supplier Listings",pending.length+" awaiting review"));
  var sb=div("pbody",null,{style:{padding:"0.8rem"}});
  if(pending.length===0)sb.appendChild(el("div",{style:{color:"var(--mut)",fontSize:"0.85rem"}},["No pending listings"]));
  pending.forEach(function(p,idx){
    var card=div("pending-card");
    card.appendChild(el("div",{style:{fontFamily:"'Barlow'",fontWeight:"700",fontSize:"0.88rem"}},[p.name]));
    card.appendChild(el("div",{style:{fontSize:"0.75rem",color:"var(--mut)",margin:"4px 0"}},[p.make+" "+p.model+" ("+p.yf+"–"+p.yt+") · "+p.brand+" · "+p.price+" BHD · Qty "+p.qty]));
    card.appendChild(el("div",{style:{fontSize:"0.72rem",color:"var(--mut)"}},["Contact: "+p.phone]));
    var acts=div("",null,{style:{display:"flex",gap:"6px",marginTop:"8px"}});
    acts.appendChild(btn("btn-grn btn-sm","✓ Approve & List",function(){
      var extra=getLog("wasel_extra_parts");
      extra.unshift({id:"E"+Date.now(),name:p.name,nameAr:p.nameAr||p.name,cat:p.cat,make:p.make,model:p.model,yf:parseInt(p.yf)||2000,yt:parseInt(p.yt)||2025,waselPrice:parseFloat(p.price)||0,retailPrice:(parseFloat(p.price)||0)*1.15,type:p.type,brand:p.brand,qty:parseInt(p.qty)||1,warranty:p.warranty});
      saveLog("wasel_extra_parts",extra);
      var newPending=pending.filter(function(x,i){return i!==idx;});
      saveLog("wasel_pending_parts",newPending);
      showToast("✓ Listed in catalogue");render();
    }));
    acts.appendChild(btn("btn-gh btn-sm","✕ Reject",function(){
      var newPending=pending.filter(function(x,i){return i!==idx;});
      saveLog("wasel_pending_parts",newPending);render();
    }));
    card.appendChild(acts);
    sb.appendChild(card);
  });
  sp.appendChild(sb);wrap.appendChild(sp);

  var rp=div("panel");
  rp.appendChild(makePHead("🔍","Customer Part Requests",rfqs.length+" received"));
  var rb=div("pbody",null,{style:{padding:"0"}});
  if(rfqs.length===0)rb.appendChild(el("div",{style:{padding:"1rem",color:"var(--mut)",fontSize:"0.85rem"}},["No requests yet"]));
  rfqs.forEach(function(r){
    var row=div("admin-qt-row",null,{style:{gridTemplateColumns:"1fr 1fr 1fr"}});
    row.appendChild(div("",[el("span",{className:"admin-lbl"},["Part"]),el("div",{style:{fontSize:"0.8rem"}},[r.part+(r.urgent?" ⚡":"")])]));
    row.appendChild(div("",[el("span",{className:"admin-lbl"},["Vehicle"]),el("div",{style:{fontSize:"0.8rem"}},[(r.make||"")+" "+(r.model||"")])]));
    row.appendChild(div("",[el("span",{className:"admin-lbl"},["Contact"]),el("div",{style:{fontSize:"0.8rem"}},[r.phone])]));
    rb.appendChild(row);
  });
  rp.appendChild(rb);wrap.appendChild(rp);

  var loiLog=getLog("wasel_loi_registrations");
  var lp=div("panel");
  lp.appendChild(makePHead("🤝","LOI Registrations",loiLog.length+" supplier/garage sign-ups from wasel-auto.vercel.app/loi"));
  var lb=div("pbody",null,{style:{padding:"0"}});
  if(loiLog.length===0)lb.appendChild(el("div",{style:{padding:"1rem",color:"var(--mut)",fontSize:"0.85rem"}},["No registrations yet"]));
  loiLog.forEach(function(r,idx){
    var card=div("pending-card",null,{style:{borderColor:r.contacted?"var(--grn)":"#f59e0b"}});
    var top=div("",null,{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:"8px"}});
    var left=div("");
    left.appendChild(el("span",{className:"pdf-status-badge "+(r.type==="supplier"?"badge-quot":"badge-paid")},[r.typeLabel]));
    left.appendChild(el("div",{style:{fontFamily:"'Barlow'",fontWeight:"700",fontSize:"0.9rem",marginTop:"4px"}},[r.company]));
    left.appendChild(el("div",{style:{fontSize:"0.78rem",color:"var(--mut)"}},[r.contact+(r.role?" — "+r.role:"")+" · "+r.phone]));
    if(r.email)left.appendChild(el("div",{style:{fontSize:"0.75rem",color:"var(--mut)"}},[r.email]));
    left.appendChild(el("div",{style:{fontSize:"0.72rem",color:"var(--mut)",marginTop:"2px"}},[r.location+" · "+r.date+" · "+r.ref]));
    var specKeys=Object.keys(r.specific||{});
    var specText=specKeys.map(function(k){return r.specific[k]?k+": "+r.specific[k]:null;}).filter(Boolean).join(" · ");
    if(specText)left.appendChild(el("div",{style:{fontSize:"0.72rem",color:"var(--mut)",marginTop:"4px",fontStyle:"italic"}},[specText]));
    top.appendChild(left);
    top.appendChild(el("span",{style:{fontSize:"0.68rem",fontWeight:"700",color:r.contacted?"var(--grn)":"#f59e0b",whiteSpace:"nowrap"}},[r.contacted?"✓ Contacted":"⏳ New"]));
    card.appendChild(top);
    var acts=div("",null,{style:{display:"flex",gap:"6px",marginTop:"8px"}});
    acts.appendChild(el("a",{href:"https://wa.me/"+r.phone.replace(/[^0-9]/g,"")+"?text="+encodeURIComponent("Hi "+r.contact+", thank you for registering with Wasel Auto (ref "+r.ref+"). Let's get you set up — "),target:"_blank",rel:"noopener",className:"btn btn-wa btn-sm"},["💬 WhatsApp"]));
    if(!r.contacted){
      acts.appendChild(btn("btn-grn btn-sm","✓ Mark Contacted",function(){
        loiLog[idx].contacted=true;saveLog("wasel_loi_registrations",loiLog);render();
      }));
    }
    card.appendChild(acts);
    lb.appendChild(card);
  });
  lp.appendChild(lb);wrap.appendChild(lp);

  return wrap;
}
