<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Wasel Auto | وصل أوتو — Find Auto Parts in Bahrain</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,600;0,700;0,900;1,700&family=JetBrains+Mono:wght@400;500&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--red:#CE1126;--red2:#e8253a;--dark:#111;--dark2:#1e1e1e;--bg:#f5f5f5;--surf:#fff;--surf2:#f0f0f0;--bdr:#e0e0e0;--txt:#111;--mut:#777;--grn:#15803d;--grn2:#dcfce7;--gold:#b45309;--gold2:#fef3c7;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--txt);font-family:'Barlow',sans-serif;min-height:100vh;}
.ar{font-family:'Cairo',sans-serif;}
.nav{display:flex;align-items:center;justify-content:space-between;padding:0 1.2rem;height:58px;background:var(--dark);border-bottom:3px solid var(--red);position:sticky;top:0;z-index:300;}
.logo{display:flex;align-items:flex-end;cursor:pointer;text-decoration:none;}
.lw{font-family:'Barlow';font-weight:900;font-size:1.6rem;color:white;letter-spacing:-1px;line-height:1;}
.la{font-family:'Barlow';font-weight:700;font-size:0.85rem;color:var(--red);font-style:italic;margin-left:4px;margin-bottom:2px;}
.nav-actions{display:flex;gap:6px;align-items:center;}
.lang-btn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:white;padding:5px 11px;border-radius:5px;font-size:0.75rem;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;}
.lang-btn:hover{background:rgba(255,255,255,0.18);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border-radius:7px;border:none;cursor:pointer;font-weight:700;transition:all 0.15s;white-space:nowrap;text-decoration:none;font-size:0.85rem;}
.btn.ar{font-family:'Cairo',sans-serif;}
.btn.en{font-family:'Barlow',sans-serif;text-transform:uppercase;letter-spacing:0.03em;}
.btn-r{background:var(--red);color:white;}.btn-r:hover{background:var(--red2);transform:translateY(-1px);box-shadow:0 4px 14px rgba(206,17,38,0.35);}
.btn-r:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none;}
.btn-d{background:var(--dark);color:white;}.btn-d:hover{background:var(--dark2);}
.btn-ol{background:transparent;color:var(--red);border:2px solid var(--red);}.btn-ol:hover{background:var(--red);color:white;}
.btn-gh{background:var(--surf2);color:var(--txt);border:1.5px solid var(--bdr);}.btn-gh:hover{border-color:var(--red);color:var(--red);}
.btn-wa{background:#25D366;color:white;}.btn-wa:hover{background:#1ebe5d;transform:translateY(-1px);}
.btn-grn{background:var(--grn);color:white;}.btn-grn:hover{background:#166534;transform:translateY(-1px);}
.btn-gold{background:var(--gold);color:white;}.btn-gold:hover{background:#92400e;transform:translateY(-1px);}
.btn-sm{padding:6px 13px;font-size:0.78rem;}
.btn-lg{padding:12px 26px;font-size:0.92rem;}
.btn-full{width:100%;}
.apptabs{display:flex;background:var(--dark2);border-bottom:2px solid var(--red);overflow-x:auto;}
.apptab{flex:1;min-width:80px;padding:10px 6px;border:none;background:transparent;color:#888;font-weight:700;cursor:pointer;transition:all 0.15s;font-size:0.75rem;border-bottom:3px solid transparent;white-space:nowrap;}
.apptab.en{font-family:'Barlow',sans-serif;text-transform:uppercase;letter-spacing:0.03em;}
.apptab.ar{font-family:'Cairo',sans-serif;font-size:0.82rem;}
.apptab.on{color:white;border-bottom-color:var(--red);background:rgba(255,255,255,0.04);}
.apptab:hover:not(.on){color:#ccc;}
.tabico{display:block;font-size:1rem;margin-bottom:2px;}
.shero{background:var(--dark);padding:1.8rem 1.2rem;border-bottom:3px solid var(--red);}
.shero-inner{max-width:700px;margin:0 auto;}
.shero-title{font-family:'Barlow';font-weight:900;font-size:clamp(1.4rem,4vw,2rem);color:white;margin-bottom:4px;}
.shero-title.ar{font-family:'Cairo';font-weight:900;}
.shero-sub{color:#999;font-size:0.88rem;margin-bottom:1.2rem;}
.shero-sub.ar{font-family:'Cairo';}
.sbox{background:white;border-radius:10px;padding:1rem;box-shadow:0 4px 20px rgba(0,0,0,0.15);}
.srow{display:grid;grid-template-columns:1fr 1fr;gap:0.7rem;margin-bottom:0.7rem;}
.ig{display:flex;flex-direction:column;gap:4px;}
.il{font-size:0.65rem;font-weight:700;letter-spacing:0.08em;color:var(--mut);text-transform:uppercase;}
.il.ar{font-family:'Cairo';letter-spacing:0;font-size:0.72rem;}
.ifield{background:var(--surf2);border:1.5px solid var(--bdr);border-radius:7px;padding:9px 12px;color:var(--txt);font-size:0.88rem;outline:none;transition:border 0.15s;width:100%;font-family:'Barlow',sans-serif;}
.ifield.ar{font-family:'Cairo',sans-serif;}
.ifield:focus{border-color:var(--red);background:white;}
.ifield::placeholder{color:#bbb;}
.sel{background:var(--surf2);border:1.5px solid var(--bdr);border-radius:7px;padding:9px 12px;color:var(--txt);font-size:0.88rem;outline:none;cursor:pointer;appearance:none;width:100%;transition:border 0.15s;font-family:'Barlow',sans-serif;}
.sel.ar{font-family:'Cairo',sans-serif;}
.sel:focus{border-color:var(--red);}
.psec{max-width:1200px;margin:0 auto;padding:1.2rem;}
.psec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px;}
.psec-title{font-family:'Barlow';font-weight:900;font-size:1.1rem;text-transform:uppercase;}
.psec-title.ar{font-family:'Cairo';text-transform:none;font-size:1.15rem;}
.psec-count{font-family:'JetBrains Mono';font-size:0.75rem;color:var(--mut);background:var(--surf2);padding:3px 10px;border-radius:99px;border:1px solid var(--bdr);}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:0.9rem;}
.pcard{background:white;border:1.5px solid var(--bdr);border-radius:10px;padding:1rem;cursor:pointer;transition:all 0.15s;position:relative;overflow:hidden;}
.pcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:transparent;transition:background 0.15s;}
.pcard:hover{border-color:var(--red);transform:translateY(-2px);box-shadow:0 6px 20px rgba(206,17,38,0.1);}
.pcard:hover::before,.pcard.hl::before{background:var(--red);}
.pcard.hl{border-color:var(--red);}
.ptype{position:absolute;top:9px;right:9px;font-size:0.6rem;font-weight:700;padding:2px 7px;border-radius:4px;text-transform:uppercase;}
.ptype-g{background:var(--dark);color:white;}
.ptype-a{background:var(--red);color:white;}
.ptype-u{background:var(--gold);color:white;}
.pcard-ico{font-size:1.6rem;margin:.3rem 0 .5rem;}
.pcard-name{font-family:'Barlow';font-weight:700;font-size:0.92rem;margin-bottom:2px;line-height:1.3;padding-right:52px;}
.pcard-name.ar{font-family:'Cairo';font-size:0.95rem;}
.pcard-brand{font-size:0.72rem;color:var(--mut);font-weight:600;margin-bottom:5px;}
.pcard-compat{font-size:0.72rem;color:var(--mut);margin-bottom:8px;}
.pcard-price{font-family:'Barlow';font-size:1.3rem;font-weight:900;color:var(--dark);}
.pcard-price span{font-size:0.7rem;color:var(--mut);margin-left:2px;font-weight:600;}
.pcard-footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--bdr);}
.war-tag{font-size:0.62rem;font-weight:700;color:var(--grn);background:var(--grn2);padding:2px 7px;border-radius:4px;}
.qty-tag{font-size:0.65rem;color:var(--mut);font-family:'JetBrains Mono';}
.pcard-cta{font-size:0.68rem;color:var(--red);margin-top:5px;font-weight:700;}
.frow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem;align-items:center;}
.pill{padding:5px 12px;border-radius:99px;border:1.5px solid var(--bdr);background:white;color:var(--mut);font-size:0.72rem;font-weight:700;cursor:pointer;transition:all 0.15s;font-family:'Barlow',sans-serif;text-transform:uppercase;}
.pill.ar{font-family:'Cairo',sans-serif;text-transform:none;font-size:0.78rem;}
.pill.on{background:var(--dark);color:white;border-color:var(--dark);}
.pill:hover:not(.on){border-color:var(--red);color:var(--red);}
.typetog{display:flex;background:var(--surf2);border:1.5px solid var(--bdr);border-radius:7px;overflow:hidden;}
.ttbtn{padding:5px 12px;border:none;background:transparent;font-size:0.72rem;font-weight:700;cursor:pointer;transition:all 0.15s;text-transform:uppercase;color:var(--mut);font-family:'Barlow',sans-serif;}
.ttbtn.ar{font-family:'Cairo',sans-serif;text-transform:none;font-size:0.78rem;}
.ttbtn.on{background:var(--dark);color:white;}
.ov{position:fixed;inset:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(4px);z-index:500;display:flex;align-items:center;justify-content:center;padding:1rem;}
.mod{background:white;border-radius:14px;max-width:480px;width:100%;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,0.25);max-height:92vh;overflow-y:auto;}
.mod-head{background:var(--dark);color:white;padding:1.2rem 1.4rem;border-bottom:3px solid var(--red);position:relative;}
.mod-close{position:absolute;top:0.9rem;right:0.9rem;background:rgba(255,255,255,0.1);border:none;color:white;border-radius:5px;width:28px;height:28px;cursor:pointer;font-size:0.85rem;display:flex;align-items:center;justify-content:center;}
.mod-pname{font-family:'Barlow';font-size:1.1rem;font-weight:900;margin-top:4px;}
.mod-pname.ar{font-family:'Cairo';}
.mod-price{font-family:'Barlow';font-size:1.8rem;font-weight:900;color:var(--red);margin-top:2px;}
.mod-body{padding:1.2rem 1.4rem;}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--bdr);font-size:0.83rem;}
.mrow:last-of-type{border-bottom:none;}
.mrl{font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--mut);}
.mrl.ar{font-family:'Cairo';letter-spacing:0;font-size:0.75rem;text-transform:none;}
.mod-notice{background:#fff8f8;border:1px solid rgba(206,17,38,0.2);border-radius:8px;padding:0.9rem;font-size:0.78rem;color:var(--mut);line-height:1.6;margin-bottom:1rem;}
.mod-notice.ar{font-family:'Cairo';font-size:0.82rem;}
.mod-actions{padding:0 1.4rem 1.4rem;display:flex;flex-direction:column;gap:8px;}
.sport{max-width:700px;margin:0 auto;padding:1.2rem;}
.sport-hero{background:var(--dark);border-radius:12px;padding:1.5rem;margin-bottom:1.2rem;border-bottom:3px solid var(--red);}
.sport-hero h2{font-family:'Barlow';font-weight:900;font-size:1.3rem;color:white;margin-bottom:4px;}
.sport-hero h2.ar{font-family:'Cairo';}
.sport-hero p{color:#999;font-size:0.85rem;}
.sport-hero p.ar{font-family:'Cairo';}
.panel{background:white;border:1.5px solid var(--bdr);border-radius:12px;overflow:hidden;margin-bottom:1rem;}
.phead{background:var(--dark);padding:0.9rem 1.2rem;display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--red);}
.phead-ico{width:30px;height:30px;background:var(--red);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:0.9rem;flex-shrink:0;}
.phead-title{font-family:'Barlow';font-weight:700;font-size:0.88rem;color:white;text-transform:uppercase;}
.phead-title.ar{font-family:'Cairo';text-transform:none;font-size:0.95rem;}
.phead-sub{font-size:0.67rem;color:#aaa;margin-top:1px;}
.phead-sub.ar{font-family:'Cairo';}
.pbody{padding:1.2rem;}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0.9rem;}
.ff{grid-column:1/-1;}
.fsec{margin-bottom:1.3rem;}
.fsec-t{font-size:0.65rem;font-weight:700;letter-spacing:0.15em;color:var(--red);text-transform:uppercase;margin-bottom:0.7rem;padding-bottom:5px;border-bottom:2px solid var(--bdr);}
.fsec-t.ar{font-family:'Cairo';letter-spacing:0;font-size:0.75rem;text-transform:none;}
.pending-card{background:white;border:1.5px solid #f59e0b;border-radius:10px;padding:1rem;margin-bottom:0.8rem;border-left:4px solid #f59e0b;}
.aibox{background:var(--dark);border-radius:9px;padding:1.1rem;margin-top:0.9rem;border-left:4px solid var(--red);}
.aiconf{font-size:0.62rem;font-weight:700;letter-spacing:0.1em;padding:2px 8px;border-radius:99px;text-transform:uppercase;font-family:'JetBrains Mono';}
.aiconf.high{background:rgba(21,128,61,0.2);color:#4ade80;border:1px solid rgba(21,128,61,0.4);}
.aiconf.medium{background:rgba(206,17,38,0.2);color:#ff9090;border:1px solid rgba(206,17,38,0.3);}
.ainm{font-family:'Barlow';font-size:1.1rem;font-weight:900;color:white;margin-top:3px;}
.aitags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.aitag{font-size:0.66rem;font-family:'JetBrains Mono';background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);border-radius:4px;padding:2px 7px;color:#ccc;}
.ainotes{margin-top:7px;font-size:0.78rem;color:#888;line-height:1.6;}
.hlbanner{background:rgba(206,17,38,0.05);border:1.5px solid rgba(206,17,38,0.18);border-radius:7px;padding:0.55rem 1rem;display:flex;align-items:center;gap:8px;margin-bottom:0.9rem;font-size:0.78rem;color:var(--red);font-weight:700;}
.hlbanner.ar{font-family:'Cairo';}
.not-found-box{background:white;border:2px dashed var(--bdr);border-radius:12px;padding:1.5rem;text-align:center;margin-top:1rem;}
.not-found-box.ar{font-family:'Cairo';}
.not-found-ico{font-size:2.5rem;margin-bottom:0.6rem;}
.not-found-title{font-family:'Barlow';font-weight:900;font-size:1rem;margin-bottom:0.4rem;}
.not-found-title.ar{font-family:'Cairo';}
.not-found-sub{font-size:0.8rem;color:var(--mut);margin-bottom:1.2rem;line-height:1.6;}
.not-found-sub.ar{font-family:'Cairo';}
.rfq-form{background:var(--surf2);border-radius:9px;padding:1rem;text-align:left;margin-top:0.8rem;}
.rfq-sent{background:var(--grn2);border:1.5px solid var(--grn);border-radius:9px;padding:1rem;text-align:center;}
.rfq-sent.ar{font-family:'Cairo';}
.loading{display:flex;align-items:center;gap:9px;color:var(--red);font-size:0.82rem;padding:0.8rem 0;font-weight:600;}
.spin{width:15px;height:15px;border:2px solid var(--bdr);border-top-color:var(--red);border-radius:50%;animation:sp 0.65s linear infinite;flex-shrink:0;}
@keyframes sp{to{transform:rotate(360deg);}}
.empty{text-align:center;padding:2rem;color:var(--mut);}
.empty h3{font-family:'Barlow';font-weight:900;color:var(--txt);margin-bottom:0.3rem;}
.empty h3.ar{font-family:'Cairo';}
.toast{position:fixed;bottom:1.2rem;right:1.2rem;background:var(--dark);color:white;padding:0.8rem 1.1rem;border-radius:8px;font-size:0.8rem;z-index:999;animation:su 0.25s ease;border-left:3px solid var(--red);font-weight:600;max-width:300px;}
.toast.ar{font-family:'Cairo';}
@keyframes su{from{transform:translateY(16px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.dzone{border:2px dashed var(--bdr);border-radius:9px;padding:1.2rem;text-align:center;cursor:pointer;transition:all 0.15s;background:var(--surf2);}
.dzone:hover,.dzone.on{border-color:var(--red);background:rgba(206,17,38,0.03);}
.dzone img{max-height:110px;border-radius:7px;object-fit:cover;}
.dzt{color:var(--mut);font-size:0.77rem;margin-top:5px;}
.dzt.ar{font-family:'Cairo';}
.hiw{max-width:700px;margin:0 auto;padding:0 1.2rem 2rem;}
.hiw-title{font-family:'Barlow';font-weight:900;font-size:1rem;text-transform:uppercase;color:var(--mut);margin-bottom:0.9rem;}
.hiw-title.ar{font-family:'Cairo';text-transform:none;}
.hiwgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.8rem;}
.hiwcard{background:white;border:1.5px solid var(--bdr);border-top:3px solid var(--red);border-radius:9px;padding:0.9rem;text-align:center;}
.hiw-num{font-size:1.4rem;margin-bottom:3px;}
.hiw-t{font-family:'Barlow';font-weight:700;font-size:0.82rem;margin:3px 0;}
.hiw-t.ar{font-family:'Cairo';}
.hiw-d{font-size:0.73rem;color:var(--mut);line-height:1.5;}
.hiw-d.ar{font-family:'Cairo';}

/* ── INVOICE TOOL ── */
.inv-wrap{max-width:800px;margin:0 auto;padding:1.2rem;}
.inv-hero{background:linear-gradient(135deg,var(--dark),var(--dark2));border-radius:12px;padding:1.4rem;margin-bottom:1.2rem;border-bottom:3px solid var(--gold);}
.inv-hero h2{font-family:'Barlow';font-weight:900;font-size:1.2rem;color:white;margin-bottom:3px;}
.inv-hero h2.ar{font-family:'Cairo';}
.inv-hero p{color:#999;font-size:0.82rem;}
.inv-hero p.ar{font-family:'Cairo';}
.inv-doc{background:white;border:1.5px solid var(--bdr);border-radius:12px;overflow:hidden;margin-bottom:1rem;}
.inv-doc-head{background:var(--dark);padding:1.2rem 1.4rem;border-bottom:3px solid var(--gold);}
.inv-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:1rem;}
.inv-logo{font-family:'Barlow';font-weight:900;font-size:1.4rem;color:white;}
.inv-logo span{color:var(--red);font-style:italic;}
.inv-meta{text-align:right;}
.inv-num{font-family:'JetBrains Mono';font-size:0.75rem;color:#aaa;}
.inv-date{font-family:'JetBrains Mono';font-size:0.7rem;color:#666;margin-top:2px;}
.inv-body{padding:1.2rem 1.4rem;}
.inv-parties{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.2rem;padding-bottom:1rem;border-bottom:1px solid var(--bdr);}
.inv-party-label{font-size:0.63rem;font-weight:700;letter-spacing:0.12em;color:var(--mut);text-transform:uppercase;margin-bottom:4px;}
.inv-party-label.ar{font-family:'Cairo';letter-spacing:0;}
.inv-party-name{font-weight:700;font-size:0.88rem;}
.inv-party-name.ar{font-family:'Cairo';}
.inv-party-sub{font-size:0.75rem;color:var(--mut);}
.inv-table{width:100%;border-collapse:collapse;margin-bottom:1rem;font-size:0.82rem;}
.inv-table th{background:var(--dark);color:white;padding:8px 10px;text-align:left;font-size:0.68rem;text-transform:uppercase;letter-spacing:0.06em;}
.inv-table th.ar{font-family:'Cairo';text-transform:none;font-size:0.75rem;}
.inv-table td{padding:8px 10px;border-bottom:1px solid var(--bdr);}
.inv-table tr:last-child td{border-bottom:none;}
.inv-table tr:hover td{background:var(--surf2);}
.inv-totals{background:var(--surf2);border-radius:8px;padding:1rem;margin-bottom:1rem;}
.inv-total-row{display:flex;justify-content:space-between;padding:4px 0;font-size:0.83rem;}
.inv-total-row.final{font-family:'Barlow';font-weight:900;font-size:1rem;color:var(--dark);padding-top:8px;margin-top:4px;border-top:2px solid var(--dark);}
.inv-total-row.final.ar{font-family:'Cairo';}
.inv-profit-row{display:flex;justify-content:space-between;padding:4px 0;font-size:0.83rem;color:var(--grn);font-weight:700;}
.inv-footer-note{font-size:0.72rem;color:var(--mut);text-align:center;padding-top:0.8rem;border-top:1px solid var(--bdr);line-height:1.6;}
.inv-footer-note.ar{font-family:'Cairo';}
.inv-add-item{background:var(--surf2);border:2px dashed var(--bdr);border-radius:9px;padding:1rem;margin-bottom:0.8rem;}
.inv-actions{display:flex;gap:8px;flex-wrap:wrap;}
.wa-msg-box{background:var(--dark);border-radius:9px;padding:1rem;margin-top:0.8rem;}
.wa-msg-title{font-size:0.65rem;font-weight:700;letter-spacing:0.12em;color:#aaa;text-transform:uppercase;margin-bottom:0.5rem;}
.wa-msg-text{font-size:0.8rem;color:#ccc;line-height:1.7;white-space:pre-wrap;font-family:'JetBrains Mono';}

@media print{
  .nav,.apptabs,.inv-hero,.inv-actions,.wa-msg-box{display:none!important;}
  .inv-wrap{padding:0;}
  .inv-doc{border:1px solid #ccc;box-shadow:none;}
}

async function askAI(prompt,b64){
  const content=[];
  if(b64)content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}});
  content.push({type:"text",text:prompt});
  const res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:800,
      system:`You are a GCC automotive parts expert. Identify parts from VIN, description or image. Respond ONLY with valid JSON no markdown: {"partName":string,"partNameAr":string,"category":string,"makes":[string],"models":[string],"yearRange":{"from":number,"to":number},"confidence":"high"|"medium"|"low","notes":string,"notesAr":string}`,
      messages:[{role:"user",content}]})
  });
  const d=await res.json();
  const t=d.content?.map(b=>b.text||"").join("")||"{}";
  try{return JSON.parse(t.replace(/```json|```/g,"").trim());}catch{return null;}
}

  const [aiRes,setAiRes]=useState(null);
  const [aiLoad,setAiLoad]=useState(false);
  const [hls,setHls]=useState([]);
  const [showRFQ,setShowRFQ]=useState(false);
  const [sf,setSf]=useState({name:"",nameAr:"",brand:"",make:"",model:"",yf:"",yt:"",price:"",type:"Genuine",cat:"Engine",qty:"",warranty:"12 months",warrantyAr:"12 شهر",phone:""});
  const fref=useRef();

  const t=(e,a)=>ar?a:e;

  const filtered=allParts.filter(p=>{
    const mc=cat==="All"||p.cat===cat;
    const mt=ptype==="All Types"||p.type===ptype;
    const mm=make==="All Makes"||p.make===make||p.make==="Universal";
    const ms=!srch||[p.name,p.nameAr,p.make,p.model,p.brand].some(v=>v.toLowerCase().includes(srch.toLowerCase()));
    return mc&&mt&&mm&&ms;
  });

  const hdImg=e=>{
    e.preventDefault();setDrag(false);
    const file=e.dataTransfer?.files[0]||e.target.files?.[0];if(!file)return;
    const r=new FileReader();
    r.onload=ev=>{setImg(ev.target.result);setB64(ev.target.result.split(",")[1]);};
    r.readAsDataURL(file);
  };

  const runAI=async()=>{
    if(!vin&&!desc&&!b64)return;
    setAiLoad(true);setAiRes(null);setHls([]);setShowRFQ(false);
    try{
      const res=await askAI(`VIN/Chassis: ${vin||"not provided"}\nDescription: ${desc||"not provided"}\n${b64?"Part image attached.":""}`,b64);
      setAiRes(res);
      if(res){
        const ids=allParts.filter(p=>
          res.models?.some(m=>p.model.toLowerCase().includes(m.toLowerCase()))||
          res.makes?.some(m=>p.make.toLowerCase().includes(m.toLowerCase()))||
          (res.category&&p.cat.toLowerCase()===res.category.toLowerCase())||
          (res.partName&&p.name.toLowerCase().includes(res.partName.toLowerCase().split(" ")[0]))
        ).map(p=>p.id);
        setHls(ids);
        if(ids.length===0)setShowRFQ(true);
      }
    }catch(e){console.error(e);}
    setAiLoad(false);
  };

  const clr=()=>{setVin("");setDesc("");setImg(null);setB64(null);setAiRes(null);setHls([]);setShowRFQ(false);};
  const showToast=m=>{setToast(m);setTimeout(()=>setToast(null),3000);};

  const addToInvoice=part=>{
    setInvoiceItems(p=>[...p,part]);
    showToast(t(`✓ ${part.name} added to invoice`," ✓ تمت الإضافة للفاتورة"));
    setTab("invoice");
  };

  const upS=(k,v)=>setSf(p=>({...p,[k]:v}));
  const submitSupplier=()=>{
    if(!sf.name||!sf.price||!sf.phone){showToast(t("Please fill required fields","يرجى تعبئة الحقول المطلوبة"));return;}
    const np={id:Date.now(),name:sf.name,nameAr:sf.nameAr||sf.name,cat:sf.cat,make:sf.make||"Universal",model:sf.model||"All",yf:Number(sf.yf)||2015,yt:Number(sf.yt)||2025,price:Number(sf.price),type:sf.type,brand:sf.brand||sf.type,qty:Number(sf.qty)||1,image:"🔧",warranty:sf.warranty,warrantyAr:sf.warrantyAr,phone:sf.phone,pending:true};
    setPending(prev=>[np,...prev]);
    showToast(t("✓ Submitted! Wasel Auto will review within 24 hours.","✓ تم الإرسال! وصل أوتو سيراجع خلال 24 ساعة."));
    setSf({name:"",nameAr:"",brand:"",make:"",model:"",yf:"",yt:"",price:"",type:"Genuine",cat:"Engine",qty:"",warranty:"12 months",warrantyAr:"12 شهر",phone:""});
  };

  const ff=ar?"'Cairo'":"'Barlow'";

  return(
    <div dir={ar?"rtl":"ltr"} style={{fontFamily:ff}}>
      <nav className="nav" dir="ltr">

          <span className="lw">Wasel</span><span className="la">Auto</span>
        </a>

          <button className="lang-btn" onClick={()=>setAr(!ar)}>{ar?"English":"عربي"}</button>
          <a className="btn btn-r btn-sm en" href="/loi.html">{t("Register Interest","سجّل اهتمامك")}</a>
        </div>
      </nav>

      <div className="apptabs">
        {[
          ["search","🔍",t("Find Parts","ابحث")],
          ["browse","🏪",t("All Parts","القطع")],
          ["supplier","➕",t("List Parts","أضف قطعاً")],
          ["invoice","🧾",t("Invoice","فاتورة")+(invoiceItems.length>0?` (${invoiceItems.length})`:"")],
        ].map(([id,ico,lb])=>(
          <button key={id} className={`apptab ${ar?"ar":"en"} ${tab===id?"on":""}`} onClick={()=>setTab(id)}>
            <span className="tabico">{ico}</span>{lb}
          </button>
        ))}
      </div>

      {/* ── FIND PARTS ── */}
      {tab==="search"&&(

          <div className="shero">

              <div className="sbox">

                  <div className="ig">
                    <label className={`il ${ar?"ar":""}`}>{t("🚗 VIN / Chassis Number","🚗 رقم الشاسيه / VIN")}</label>
                    <input className={`ifield ${ar?"ar":""}`} placeholder={t("e.g. JTDZN3EU0E329","مثال: JTDZN3EU0E329")} value={vin} onChange={e=>setVin(e.target.value)} onKeyDown={e=>e.key==="Enter"&&runAI()}/>
                  </div>
                  <div className="ig">
                    <label className={`il ${ar?"ar":""}`}>{t("📝 Part Description","📝 وصف القطعة")}</label>
                    <input className={`ifield ${ar?"ar":""}`} placeholder={t("e.g. front brake pads, oil filter…","مثال: تيل فرامل أمامي، فلتر زيت…")} value={desc} onChange={e=>setDesc(e.target.value)} onKeyDown={e=>e.key==="Enter"&&runAI()}/>

              <div className="hiwgrid">
                {[
                  ["🔍",t("Search or Request","ابحث أو اطلب"),t("Search our catalogue or submit a request for any part not listed","ابحث في كتالوجنا أو أرسل طلباً لأي قطعة غير مدرجة")],
                  ["📞",t("We Source It","نوفرها لك"),t("Wasel Auto checks with suppliers and confirms availability and price within 2 hours","وصل أوتو يتحقق مع الموردين ويؤكد التوفر والسعر خلال ساعتين")],
                  ["🧾",t("Invoice Your Customer","افترّ عميلك"),t("Use our free invoice tool to add your margin and send a professional invoice via WhatsApp","استخدم أداة الفاتورة المجانية لإضافة هامشك وإرسال فاتورة احترافية")],
                ].map(([ico,tit,dsc])=>(
                  <div key={tit} className="hiwcard">
                    <div className="hiw-num">{ico}</div>
                    <div className={`hiw-t ${ar?"ar":""}`}>{tit}</div>
                    <div className={`hiw-d ${ar?"ar":""}`}>{dsc}</div>
                  </div>
                ))}
              </div>
              <div style={{marginTop:"1rem",background:"white",border:"1.5px solid var(--bdr)",borderRadius:10,padding:"1rem",display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:"0.88rem",marginBottom:3,fontFamily:ar?"'Cairo'":"'Barlow'"}}>
                    {t("Can't find your part? We source it.","ما تلقيت القطعة؟ نوفرها لك.")}
                  </div>
                  <div style={{fontSize:"0.78rem",color:"var(--mut)",fontFamily:ar?"'Cairo'":"'Barlow'"}}>
                    {t("Contact Wasel Auto directly — WhatsApp or call.","تواصل مع وصل أوتو مباشرة — واتساب أو اتصال.")}
                  </div>
                </div>
                <div style={{display:"flex",gap:7,flexShrink:0}}>
                  <a className={`btn btn-wa btn-sm ${ar?"ar":"en"}`} href="https://wa.me/97333844859" target="_blank" rel="noopener noreferrer">💬 WhatsApp</a>
                  <a className={`btn btn-d btn-sm ${ar?"ar":"en"}`} href="tel:+97333844859">📞 {t("Call","اتصل")}</a>
                </div>
              </div>
            </div>
          )}
        </>
      )}

      {/* ── BROWSE ── */}
      {tab==="browse"&&(
        <div className="psec">
          <div style={{paddingTop:"0.8rem"}}>
            <div className="psec-header">
              <div className={`psec-title ${ar?"ar":""}`}>{t("Parts Catalogue","كتالوج القطع")}</div>
              <span className="psec-count">{filtered.length} {t("parts","قطعة")}</span>
            </div>
            <div style={{marginBottom:"0.8rem"}}>
              <input className={`ifield ${ar?"ar":""}`} placeholder={t("Search by name, make, model, brand…","ابحث بالاسم، الماركة، الموديل…")} value={srch} onChange={e=>setSrch(e.target.value)} style={{background:"white",border:"1.5px solid var(--bdr)"}}/>
            </div>
            <div className="frow">
              <div className="typetog">
                {PTYPES.map((pt,i)=>(
                  <button key={pt} className={`ttbtn ${ar?"ar":"en"} ${ptype===pt?"on":""}`} onClick={()=>setPtype(pt)}>{ar?PTYPES_AR[i]:pt}</button>
                ))}
              </div>
              {CATS.map((c,i)=>(
                <button key={c} className={`pill ${ar?"ar":"en"} ${cat===c?"on":""}`} onClick={()=>setCat(c)}>{ar?CATS_AR[i]:c}</button>
              ))}
            </div>
            <div className="frow">
              {MAKES.map((m,i)=>(
                <button key={m} className={`pill ${ar?"ar":"en"} ${make===m?"on":""}`} onClick={()=>setMake(m)}>{ar?MAKES_AR[i]:m}</button>
              ))}
            </div>
            {filtered.length===0
              ?<div className="empty">
                  <div style={{fontSize:"2.2rem",marginBottom:"0.6rem"}}>🔎</div>
                  <h3 className={ar?"ar":""}>{t("No parts found","لا توجد قطع")}</h3>
                  <p style={{fontSize:"0.82rem",color:"var(--mut)",marginBottom:"1rem",fontFamily:ar?"'Cairo'":"'Barlow'"}}>{t("Submit a request and we will source it for you","أرسل طلباً وسنوفرها لك")}</p>
                  <RFQForm ar={ar} onClose={()=>setCat("All")} searchTerm={srch}/>
                </div>
              :<div className="pgrid">{filtered.map(p=><PartCard key={p.id} part={p} ar={ar} onClick={()=>setSelPart(p)}/>)}</div>}
          </div>
        </div>
      )}

      {/* ── SUPPLIER PORTAL ── */}
      {tab==="supplier"&&(
        <div className="sport">
          <div className="sport-hero">
            <h2 className={ar?"ar":""}>{t("List Your Parts on Wasel Auto","أضف قطعك على وصل أوتو")}</h2>
            <p className={ar?"ar":""}>{t("Reach garages across Bahrain. Free to list. We review and approve within 24 hours.","وصّل قطعك لورش البحرين. مجاني للإدراج. نراجع ونوافق خلال 24 ساعة.")}</p>
          </div>
          {pending.length>0&&(
            <div className="panel">
              <div className="phead"><div className="phead-ico">⏳</div><div><div className={`phead-title ${ar?"ar":""}`}>{t("Pending Approval","بانتظار الموافقة")}</div><div className={`phead-sub ${ar?"ar":""}`}>{t("Being reviewed by Wasel Auto","قيد المراجعة من وصل أوتو")}</div></div></div>
              <div className="pbody">
                {pending.map(p=>(
                  <div key={p.id} className="pending-card">
                    <div style={{fontFamily:ar?"'Cairo'":"'Barlow'",fontWeight:700,fontSize:"0.9rem"}}>{ar?p.nameAr:p.name}</div>
                    <div style={{fontSize:"0.72rem",color:"var(--mut)",marginTop:3}}>{p.make} {p.model} · {p.price.toFixed(3)} BHD</div>
                    <div style={{display:"inline-flex",alignItems:"center",gap:5,background:"#fff8e1",border:"1px solid #f59e0b",color:"#b45309",fontSize:"0.68rem",fontWeight:700,padding:"2px 8px",borderRadius:4,marginTop:6,fontFamily:ar?"'Cairo'":"'Barlow'"}}>⏳ {t("Awaiting Wasel Auto Approval","بانتظار موافقة وصل أوتو")}</div>
                  </div>
                ))}
              </div>
            </div>
          )}
          <div className="panel">
            <div className="phead"><div className="phead-ico">📦</div><div><div className={`phead-title ${ar?"ar":""}`}>{t("New Part Listing","إدراج قطعة جديدة")}</div><div className={`phead-sub ${ar?"ar":""}`}>{t("Goes live after Wasel Auto review","يُنشر بعد مراجعة وصل أوتو")}</div></div></div>
            <div className="pbody">
              <div className="fsec"><div className={`fsec-t ${ar?"ar":""}`}>{t("Part Details","تفاصيل القطعة")}</div>
                <div className="fgrid">
                  <div className="ig ff"><label className={`il ${ar?"ar":""}`}>{t("Part Name (English) *","اسم القطعة (إنجليزي) *")}</label><input className="ifield" placeholder="e.g. Toyota Genuine Brake Pads" value={sf.name} onChange={e=>upS("name",e.target.value)}/></div>
                  <div className="ig ff"><label className="il ar">اسم القطعة (عربي)</label><input className="ifield ar" dir="rtl" placeholder="مثال: تيل فرامل تويوتا أصلي" value={sf.nameAr} onChange={e=>upS("nameAr",e.target.value)}/></div>
                  <div className="ig"><label className={`il ${ar?"ar":""}`}>{t("Part Type","نوع القطعة")}</label><select className={`sel ${ar?"ar":""}`} value={sf.type} onChange={e=>upS("type",e.target.value)}><option value="Genuine">{t("Genuine","أصلي")}</option><option value="Aftermarket">{t("Aftermarket","بديل")}</option></select></div>
                  <div className="ig"><label className={`il ${ar?"ar":""}`}>{t("Category","التصنيف")}</label><select className={`sel ${ar?"ar":""}`} value={sf.cat} onChange={e=>upS("cat",e.target.value)}>{CATS.filter(c=>c!=="All").map((c,i)=><option key={c} value={c}>{ar?CATS_AR[i+1]:c}</option>)}</select></div>
                  <div className="ig"><label className={`il ${ar?"ar":""}`}>{t("Brand","الماركة")}</label><input className={`ifield ${ar?"ar":""}`} placeholder={t("e.g. Toyota, Bosch","تويوتا، بوش")} value={sf.brand} onChange={e=>upS("brand",e.target.value)}/></div>
                  <div className="ig"><label className={`il ${ar?"ar":""}`}>{t("Qty in Stock","الكمية المتوفرة")}</label><input className="ifield" type="number" placeholder="1" value={sf.qty} onChange={e=>upS("qty",e.target.value)} dir="ltr"/></div>
                  <div className="ig"><label className={`il ${ar?"ar":""}`}>{t("Warranty","الضمان")}</label><select className={`sel ${ar?"ar":""}`} value={sf.warranty} onChange={e=>upS("warranty",e.target.value)}><option value="N/A">{t("No warranty","لا يوجد")}</option><option value="3 months">{t("3 months","3 أشهر")}</option><option value="6 months">{t("6 months","6 أشهر")}</option><option value="12 months">{t("12 months","12 شهر")}</option><option value="24 months">{t("24 months","24 شهر")}</option></select></div>
                  <div className="ig"><label className={`il ${ar?"ar":""}`}>{t("Price (BHD) *","السعر (دينار) *")}</label><input className="ifield" type="number" step="0.001" placeholder="0.000" value={sf.price} onChange={e=>upS("price",e.target.value)} dir="ltr"/></div>
                </div>
              </div>
              <div className="fsec"><div className={`fsec-t ${ar?"ar":""}`}>{t("Vehicle Compatibility","توافق السيارة")}</div>
                <div className="fgrid">
                  <div className="ig"><label className={`il ${ar?"ar":""}`}>{t("Make","الشركة")}</label><input className={`ifield ${ar?"ar":""}`} placeholder={t("e.g. Toyota","تويوتا")} value={sf.make} onChange={e=>upS("make",e.target.value)}/></div>
                  <div className="ig"><label className={`il ${ar?"ar":""}`}>{t("Model","الموديل")}</label><input className={`ifield ${ar?"ar":""}`} placeholder={t("e.g. Land Cruiser","لاند كروزر")} value={sf.model} onChange={e=>upS("model",e.target.value)}/></div>
                  <div className="ig"><label className={`il ${ar?"ar":""}`}>{t("Year From","من سنة")}</label><input className="ifield" type="number" placeholder="2018" value={sf.yf} onChange={e=>upS("yf",e.target.value)} dir="ltr"/></div>
                  <div className="ig"><label className={`il ${ar?"ar":""}`}>{t("Year To","إلى سنة")}</label><input className="ifield" type="number" placeholder="2025" value={sf.yt} onChange={e=>upS("yt",e.target.value)} dir="ltr"/></div>
                </div>
              </div>
              <div className="fsec"><div className={`fsec-t ${ar?"ar":""}`}>{t("Contact Details","بيانات التواصل")}</div>
                <div className="ig"><label className={`il ${ar?"ar":""}`}>{t("WhatsApp Number *","رقم واتساب *")}</label><input className="ifield" type="tel" placeholder="+973 XXXX XXXX" value={sf.phone} onChange={e=>upS("phone",e.target.value)} dir="ltr"/></div>
              </div>
              <div style={{background:"#fffbeb",border:"1px solid #f59e0b",borderRadius:8,padding:"0.85rem",marginBottom:"1rem",fontSize:"0.78rem",color:"#92400e",lineHeight:1.6,fontFamily:ar?"'Cairo'":"'Barlow'"}}>
                ⏳ {t("After submitting, Wasel Auto will review and approve your listing within 24 hours before it goes live.","بعد الإرسال، سيراجع وصل أوتو ويوافق على إدراجك خلال 24 ساعة قبل النشر.")}
              </div>
              <button className={`btn btn-r btn-lg btn-full ${ar?"ar":"en"}`} onClick={submitSupplier}>{t("✓ Submit for Approval","✓ أرسل للموافقة")}</button>
              <div style={{marginTop:"0.8rem",textAlign:"center",fontSize:"0.78rem",color:"var(--mut)",fontFamily:ar?"'Cairo'":"'Barlow'"}}>
                {t("Questions? ","أسئلة؟ ")}<a href="https://wa.me/97333844859" style={{color:"var(--red)",fontWeight:700}}>WhatsApp</a>{t(" or ","  أو  ")}<a href="tel:+97333844859" style={{color:"var(--red)",fontWeight:700}}>{t("Call","اتصل")}</a>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ── INVOICE ── */}
      {tab==="invoice"&&<InvoiceTool ar={ar} initialItems={invoiceItems}/>}

      <PartModal part={selPart} ar={ar} onClose={()=>setSelPart(null)} onAddToInvoice={addToInvoice}/>
      {toast&&<div className={`toast ${ar?"ar":""}`}>{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
